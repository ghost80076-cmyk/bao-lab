<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow"><meta name="theme-color" content="#18111f">
<title>正則管理器｜BAO/LAB</title>
<link rel="icon" type="image/svg+xml" href="assets/bao-mark.svg">
<link rel="stylesheet" href="css/base.css">
<style>
body{background:#18111f;color:#f4edf4}main{width:min(1040px,95%);margin:38px auto 80px}h1{font-size:2rem}h2{font-size:1.2rem;margin:4px 0 14px}.panel{padding:22px;background:#251b2b;border:1px solid #735474;border-radius:17px;margin:16px 0;box-shadow:0 10px 25px #0002}.muted{color:#dbbfd8;line-height:1.8}button,.action{font:inherit;cursor:pointer;border-radius:9px;border:1px solid #b88fb7;padding:9px 14px;background:#452b46;color:#fff}button:hover,.action:hover{background:#634064}button:disabled{opacity:.5}button.primary{background:#a65d8b;color:white}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>label{display:flex;gap:5px;align-items:center}.rule{padding:12px;border:1px solid #5f4664;border-radius:12px;margin:10px 0;display:grid;gap:9px}.rule-grid{display:grid;grid-template-columns:2fr 1fr;gap:9px}input:not([type=checkbox]),textarea{width:100%;box-sizing:border-box;border:1px solid #8d7191;border-radius:8px;background:#180f1c;color:white;padding:10px;font:inherit}textarea{min-height:90px;resize:vertical}label span{display:block;margin:0 0 5px}small{color:#d6bed5}.warning{color:#ffd0a9}#status{min-height:1.7em}#rule-list:empty::after{content:'尚無規則，請新增或匯入 JSON。';color:#dbbfd8}@media(max-width:650px){.rule-grid{grid-template-columns:1fr}.panel{padding:14px}}
</style>
</head>
<body><main>
<header><a href="./" class="action">← 返回 BAO/LAB</a><h1>正則管理器</h1><p class="muted">在自己的瀏覽器執行文字替換，無須 API Key，不會額外呼叫 AI。只改變聊天畫面的顯示，不改寫故事原文、記憶、世界狀態或備份。請先預覽再啟用。</p></header>
<section class="panel"><h2>我的正則資料庫</h2><div class="row"><label><input id="active" type="checkbox">在本機聊天畫面啟用</label><button id="add" type="button">＋ 新增文字正則</button><button id="import" type="button">匯入 JSON</button><input id="import-file" type="file" accept=".json,application/json" hidden><button id="export" type="button">匯出 JSON 備份</button></div><p class="muted">支援 BAO/LAB rules、部分酒館 regex_scripts JSON。含 HTML／CSS／JavaScript 的規則只標示不相容，禁止執行；匯入後請確認規則。最多 40 條，每條文字不超過 12,000 字元。</p><div id="rule-list"></div><div class="row"><button id="save" class="primary" type="button">儲存本機規則</button><button id="reset" type="button">清除本機規則</button></div><p id="status" role="status" aria-live="polite"></p></section>
<section class="panel"><h2>本機預覽（不呼叫 AI）</h2><label><span>測試原文</span><textarea id="source" placeholder="例：NPC: 你好"></textarea></label><div class="row"><button id="preview" type="button">測試替換</button></div><label><span>替換結果</span><textarea id="result" readonly></textarea></label><p class="muted">測試結果只是顯示，不會送入模型。已由 AI 產生的狀態標記仍計入原本的輸出 Token；正則不會把那筆費用消掉。</p></section>
</main>
<script src="js/regex-library.js"></script>
<script>
(() => {
  'use strict';
  const R = window.BAORegex;
  const $ = id => document.getElementById(id);
  let state = R.load();
  const status = message => { $('status').textContent = message; };
  const field = (value, placeholder, onChange) => {
    const input = document.createElement('input'); input.value = value; input.placeholder = placeholder;
    input.addEventListener('input', () => onChange(input.value)); return input;
  };
  const render = () => {
    $('active').checked = state.active;
    const host = $('rule-list'); host.replaceChildren();
    state.rules.forEach((rule, index) => {
      const card = document.createElement('div'); card.className = 'rule';
      const heading = document.createElement('div'); heading.className = 'row';
      const enabled = document.createElement('input'); enabled.type = 'checkbox'; enabled.checked = rule.enabled;
      enabled.disabled = Boolean(rule.reason && rule.reason !== '原規則已停用');
      enabled.addEventListener('change', () => { rule.enabled = enabled.checked; if (enabled.checked) rule.reason = ''; });
      const title = document.createElement('strong'); title.textContent = `${index + 1}. ${rule.name}`;
      const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = '移除';
      remove.addEventListener('click', () => { state.rules.splice(index, 1); render(); });
      heading.append(enabled, title, remove); card.append(heading);
      const name = field(rule.name, '規則名稱', value => { rule.name = value; title.textContent = `${index + 1}. ${value}`; });
      const pattern = field(rule.pattern, '比對式，例如 NPC:', value => { rule.pattern = value; });
      const flags = field(rule.flags || 'g', '旗標 g / gi', value => { rule.flags = value; });
      const replacement = field(rule.replacement, '替換為（純文字）', value => { rule.replacement = value; });
      [name,pattern,flags,replacement].forEach((element, n) => {
        const label = document.createElement('label'); const s = document.createElement('span');
        s.textContent = ['名稱','正則比對式','旗標','替換文字'][n]; label.append(s,element); card.append(label);
      });
      if (rule.reason) { const note = document.createElement('small'); note.className = 'warning'; note.textContent = `無法啟用：${rule.reason}`; card.append(note); }
      host.append(card);
    });
  };
  const save = () => {
    const errors = state.rules.map((rule, i) => ({ index:i, item:R.validate(rule,i) })).filter(x => x.item.reason && x.item.reason !== '原規則已停用');
    if (errors.some(x => state.rules[x.index].enabled)) {
      const e = errors[0]; status(`第 ${e.index + 1} 條規則無法啟用：${e.item.reason}`); return;
    }
    state = R.save(state); render(); status('✓ 規則已儲存於這台瀏覽器；切回聊天頁即可套用。');
  };
  $('add').addEventListener('click', () => {
    if (state.rules.length >= R.MAX_RULES) { status('最多 40 條，請先移除不需要的規則。'); return; }
    state.rules.push({name:`新規則 ${state.rules.length+1}`, pattern:'', replacement:'', flags:'g', enabled:false}); render();
  });
  $('active').addEventListener('change', () => { state.active = $('active').checked; });
  $('save').addEventListener('click', save);
  $('reset').addEventListener('click', () => {
    if (!confirm('確定清除本機正則規則？請先匯出 JSON 備份。')) return;
    state = R.save({active:false,rules:[]});render();status('✓ 已清除正則設定；故事存檔未受影響。');
  });
  $('import').addEventListener('click', () => $('import-file').click());
  $('import-file').addEventListener('change', async event => {
    const file = event.target.files?.[0]; event.target.value = ''; if (!file) return;
    try {
      if (file.size > 1024*1024) throw new Error('JSON 不可超過 1 MB。');
      const rules = R.importRules(JSON.parse(await file.text()));
      if (!confirm(`準備匯入 ${rules.length} 條規則並取代目前編輯內容。請確認是否繼續？`)) return;
      state = { active:false, rules }; render();
      status(`匯入 ${rules.length} 條；其中 ${rules.filter(x=>!!x.reason && x.reason !== '原規則已停用').length} 條不相容。預設關閉，檢查後按「儲存本機規則」。`);
    } catch (error) { status('✕ ' + error.message); }
  });
  $('preview').addEventListener('click', () => {
    try {
      const invalid = state.rules.find(x => x.enabled && !R.validate(x).enabled);
      if (invalid) throw new Error(`「${invalid.name}」的正則有誤，請先修改。`);
      $('result').value = R.apply($('source').value, state.rules); status('✓ 本機測試完成，沒有呼叫 AI。');
    } catch (error) { status('✕ ' + error.message); }
  });
  $('export').addEventListener('click', () => {
    const contents = JSON.stringify({version:1, rules:state.rules.map(R.validate)},null,2);
    const url = URL.createObjectURL(new Blob([contents],{type:'application/json'}));
    const a = document.createElement('a');a.href=url;a.download='bao-lab-regex.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
    status('✓ 已匯出文字正則規則，不包含 API Key 或故事內容。');
  });
  render();
})();
</script>
</body></html>
