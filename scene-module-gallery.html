<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAO/LAB｜場景 HTML 模組預覽</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#101118;color:#f1f1f6}*{box-sizing:border-box}body{max-width:860px;margin:auto;padding:24px 16px}h1{font-size:clamp(1.5rem,5vw,2.2rem)}p{line-height:1.75;color:#c5c6d0}fieldset{border:1px solid #5556;border-radius:14px;padding:14px;display:grid;gap:12px}label{display:grid;gap:6px}select,textarea{font:inherit;color:inherit;background:#22232d;border:1px solid #7777;border-radius:8px;padding:10px;width:100%}textarea{min-height:135px;resize:vertical}button{font:inherit;border:1px solid #9997;border-radius:9px;padding:9px 12px;background:#292b39;color:inherit;cursor:pointer}.controls{display:flex;flex-wrap:wrap;gap:8px}.scene{margin-top:22px;border:1px solid var(--edge);background:var(--bg);color:var(--fg);border-radius:18px;padding:clamp(16px,4vw,28px);line-height:1.9;overflow-wrap:anywhere}.scene header{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--edge);padding-bottom:10px;margin-bottom:14px}.scene .body{white-space:pre-wrap}.scene .hint{font-size:.8rem;opacity:.78}.scene[data-type=romance]{--bg:#30232e;--fg:#ffe5f0;--edge:#b97b9a}.scene[data-type=intimacy]{--bg:#271e2b;--fg:#f3dce9;--edge:#8c718a}.scene[data-type=danger]{--bg:#30211f;--fg:#ffe0c5;--edge:#d08a60}.scene[data-type=mystery]{--bg:#1d292a;--fg:#d3efdf;--edge:#689a8c}.scene[data-type=general]{--bg:#232532;--fg:#e6e8f7;--edge:#777e9d}.scene[data-type=mystery] .body{border-left:2px dashed var(--edge);padding-left:14px}.scene[data-type=danger] header{letter-spacing:.07em;font-weight:700}.scene[data-type=romance] header,.scene[data-type=intimacy] header{font-family:Georgia,serif}.note{font-size:.85rem}.plain{background:transparent!important;border:0!important;color:inherit!important;padding:0!important}.plain header{display:none}.plain .body{white-space:pre-wrap}a{color:#b8cbff}
</style></head><body><p><a href="./">← 返回 BAO/LAB</a></p><h1>HTML 場景模組預覽</h1><p>此頁是獨立的網站端視覺原型，不連接 API、不傳送故事內容，也不修改世界狀態或角色卡。親密情境僅改變版型，不推斷角色意願或新增劇情。</p><fieldset><legend>場景設定</legend><label>呈現模式<select id="mode"><option value="auto">內建場景</option><option value="plain">純文字</option></select></label><label>場景類型<select id="type"><option value="general">通用</option><option value="romance">甜蜜戀愛</option><option value="intimacy">成人親密</option><option value="danger">危險／對峙</option><option value="mystery">詭異／解謎</option></select></label><label>測試敘事<textarea id="story">窗外的雨漸漸停了。\n小雨：「你終於來了。」</textarea></label><div class="controls"><button type="button" id="sample">載入此場景示例</button><button type="button" id="reset">恢復通用</button></div></fieldset><section class="scene" id="scene" data-type="general" aria-live="polite"><header><span id="heading">◈ 通用場景</span><span class="hint">BAO/LAB · 網站端排版</span></header><div class="body" id="body"></div></section><p class="note">設計界線：不注入 script、不執行玩家文字中的 HTML、不依版型猜測 NPC 情緒、同意、線索或危險程度。正式聊天頁尚需接入此模組。</p><script>
(()=>{'use strict';const types={general:['◈ 通用場景','窗外的雨漸漸停了。\n小雨：「你終於來了。」'],romance:['♡ 甜蜜戀愛','兩人並肩坐在窗邊。\n小雨：「今天想一起散步嗎？」'],intimacy:['✧ 成人親密','燈光柔和下，兩人談起彼此的期待與界線。'],danger:['⚠ 危險／對峙','走廊盡頭傳來急促的腳步聲。\n門仍然敞開著。'],mystery:['⌕ 詭異／解謎','桌上有一張沒有署名的紙條。\n紙條上寫著：「第三扇門。」']};const $=id=>document.getElementById(id);function paint(){const type=$('type').value;const plain=$('mode').value==='plain';$('scene').dataset.type=type;$('scene').classList.toggle('plain',plain);$('heading').textContent=types[type][0];$('body').textContent=$('story').value;}$('type').addEventListener('change',paint);$('mode').addEventListener('change',paint);$('story').addEventListener('input',paint);$('sample').addEventListener('click',()=>{$('story').value=types[$('type').value][1];paint();});$('reset').addEventListener('click',()=>{$('type').value='general';$('mode').value='auto';$('story').value=types.general[1];paint();});paint();})();
</script></body></html>
