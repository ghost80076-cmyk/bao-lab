<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自主NPC世界｜開場預覽 · BAO/LAB</title><style>:root{color-scheme:dark;font-family:system-ui,'Noto Sans TC',sans-serif}*{box-sizing:border-box}body{margin:0;background:#151126;color:#f8f4ff;line-height:1.65}.wrap{max-width:860px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:22px;overflow:hidden;display:grid;grid-template-columns:minmax(0,180px) 1fr;align-items:center}.hero img{width:100%;height:220px;object-fit:cover}.hero div{padding:24px}h1{font-size:clamp(1.4rem,4vw,2.2rem);margin:0}h2{font-size:1.12rem;margin:0 0 12px}.card{background:#252039;border:1px solid #51446d;border-radius:18px;padding:20px;margin-top:16px}.options{display:flex;flex-wrap:wrap;gap:10px}button{font:inherit;cursor:pointer;border:1px solid #9c89d7;background:#332a50;color:#fff;border-radius:12px;padding:10px 14px;max-width:100%;text-align:left}button[aria-pressed=true]{background:#667eea;border-color:#d5caff;outline:2px solid #d5caff}button:focus-visible{outline:3px solid #ffd700;outline-offset:3px}.note{color:#d6cbe9;font-size:.92rem}#summary{white-space:pre-wrap;background:#18132a;border-radius:12px;padding:14px;overflow-wrap:anywhere}.primary{background:#7658d4;border-color:#b7a5ff}a{color:#d3c4ff}@media(max-width:480px){.wrap{padding:12px}.hero{grid-template-columns:100px minmax(0,1fr)}.hero img{height:170px}.hero div{padding:12px}.card{padding:14px}button{flex:1 1 130px}}</style></head><body><main class="wrap"><header class="hero"><img src="https://i.meee.com.tw/CZubuJ9.jpg" alt="自主NPC世界角色卡封面" referrerpolicy="no-referrer"><div><h1>🌟 動態世界模擬器</h1><p>這不是普通的角色卡。每個 NPC 都有自己的生活、目標與界線。</p></div></header><section class="card"><h2>🖥️ 步驟一：輸出模式</h2><div class="options" data-group="display"><button type="button" aria-pressed="true" data-value="純文字">1️⃣ 純文字</button><button type="button" aria-pressed="false" data-value="網站介面">2️⃣ 網站介面（推薦）</button><button type="button" aria-pressed="false" data-value="作者HTML">3️⃣ 作者 HTML</button></div><p class="note">作者 HTML 須由網站安全渲染；此頁僅預覽選擇，不會執行任意腳本。</p></section><section class="card"><h2>🎮 步驟二：遊戲模式</h2><div class="options" data-group="mode"><button type="button" aria-pressed="true" data-value="單角色深度互動">🎭 單角色</button><button type="button" aria-pressed="false" data-value="完整世界與多NPC">🌍 完整世界</button><button type="button" aria-pressed="false" data-value="自訂開局">⚙️ 自訂開局</button></div></section><section class="card"><h2>🌍 步驟三：世界觀</h2><div class="options" data-group="world"><button type="button" aria-pressed="true" data-value="現代都市">🌆 現代都市</button><button type="button" aria-pressed="false" data-value="成人校園日常">🏫 成人校園</button><button type="button" aria-pressed="false" data-value="都市奇幻">🌃 都市奇幻</button><button type="button" aria-pressed="false" data-value="賽博朋克">🤖 賽博朋克</button><button type="button" aria-pressed="false" data-value="奇幻冒險">⚔️ 奇幻冒險</button><button type="button" aria-pressed="false" data-value="末日廢土">💀 末日廢土</button><button type="button" aria-pressed="false" data-value="科幻太空">🚀 科幻太空</button><button type="button" aria-pressed="false" data-value="恐怖驚悚">👻 恐怖驚悚</button><button type="button" aria-pressed="false" data-value="自訂世界觀">✏️ 自訂</button></div></section><section class="card"><h2>⚡ 開局指令預覽</h2><p class="note">以下按鈕只會複製指令；不會啟動故事、傳送 API Key 或修改存檔。</p><div id="summary" aria-live="polite"></div><div class="options"><button class="primary" id="copy" type="button">複製開局指令</button><button id="random" type="button">🎲 隨機生成世界觀</button></div><p id="feedback" role="status" class="note"></p></section><p class="note">BAO/LAB · 獨立開場介面預覽，尚未接入正式聊天流程。</p></main><script>const groups=[...document.querySelectorAll('[data-group]')];function value(g){return g.querySelector('[aria-pressed="true"]').dataset.value}function command(){return '選擇'+value(groups[0])+'模式；'+value(groups[1])+'；世界觀：'+value(groups[2])+'。請依自主NPC世界設定開始，先確認尚未提供的玩家資料。'}function render(){document.getElementById('summary').textContent=command()}groups.forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button[data-value]');if(!b||!g.contains(b))return;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));document.getElementById('random').addEventListener('click',()=>{const g=groups[2],a=[...g.querySelectorAll('button')];const b=a[Math.floor(Math.random()*a.length)];a.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(command());document.getElementById('feedback').textContent='已複製，可貼入 BAO/LAB 聊天輸入框。'}catch{document.getElementById('feedback').textContent='無法自動複製，請手動選取上方指令。'}});render();</script></body></html>
