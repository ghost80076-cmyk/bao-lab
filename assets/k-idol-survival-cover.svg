  <linearGradient id="blondHair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0d1"/><stop offset=".55" stop-color="#cba98e"/><stop offset="1" stop-color="#765f62"/></linearGradient>
  <linearGradient id="outfitDark" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#252738"/><stop offset=".45" stop-color="#07090f"/><stop offset="1" stop-color="#321b34"/></linearGradient>
  <linearGradient id="outfitWhite" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#c8cbd7"/><stop offset="1" stop-color="#7e7891"/></linearGradient>
