name: One-time Desire District NPC migration
on:
  push:
    paths:
      - .github/workflows/desire-district-npc-migration.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match reviewed patch against newest card lore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/fix-desire-district-npc.py')
          text = path.read_text(encoding='utf-8')
          old = '不得將『學生妹』『蘿莉』『未成年』『看似小孩』等未成年或幼態設定用於性化角色。'
          new = '不得將學生、幼態、兒童或看似未成年的人物性化。'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Patch reviewed character and scene NPC integration
        run: python3 scripts/fix-desire-district-npc.py
      - name: Complete scene status conditional expression and update regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/scene-html-modes.js')
          text = path.read_text(encoding='utf-8')
          old = "      return line;\n    });\n    if (!rows.length) {"
          new = "      return line;\n    }) : [];\n    if (!rows.length) {"
          assert text.count(old) == 1, 'Unexpected scene status renderer'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          path = Path('tests/desire-district-core.cjs')
          text = path.read_text(encoding='utf-8')
          old = "assert.ok(card.content.system_prompt.includes('貓姐兒只是開場'));"
          new = "assert.ok(card.content.system_prompt.includes('貓姐兒是開場入口的實際'));\nassert.equal(card.gameplay.initial_state.npcs[0].presence, 'present');"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = "assert.ok(initial.npcs[0].notes.includes('開場當前NPC'));"
          new = "assert.ok(initial.npcs[0].notes.includes('開場時在登記處與玩家互動的當前NPC'));"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify syntax and NPC lifecycle
        run: |
          node --check js/state.js
          node --check js/helper-data.js
          node --check js/world-state.js
          node --check js/character-status.js
          node --check js/character-status-ui.js
          node --check js/scene-html-modes.js
          node tests/desire-district-current-npc.cjs
          node tests/desire-district-core.cjs
          node tests/character-status-core.cjs
          git diff --check
      - name: Commit migration without leaving a self-triggering workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/fix-desire-district-npc.py .github/workflows/desire-district-npc-migration.yml
          git add data/characters/general/desire-district.json js/character-status.js js/state.js js/helper-data.js js/world-state.js js/character-status-ui.js js/scene-html-modes.js tests/desire-district-current-npc.cjs tests/desire-district-core.cjs
          git diff --cached --check
          git commit -m 'Track Desire District current NPC by scene and simplify adult-only prompt'
          git push origin HEAD:main
