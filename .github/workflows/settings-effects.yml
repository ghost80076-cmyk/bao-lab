name: Settings scope and request evidence
on:
  pull_request:
    paths:
      - 'js/settings-effects*.js'
      - 'css/settings-effects.css'
      - 'js/narrative-settings.js'
      - 'js/player-settings.js'
      - 'js/context-inspector.js'
      - 'js/story-reader.js'
      - 'js/story-revision-state.js'
      - 'js/story-control-center.js'
      - 'js/site-ui.js'
      - 'tests/settings-effects*.cjs'
      - 'tests/context-inspector-revision.cjs'
      - 'tests/e2e/request-feature-contract.spec.cjs'
      - 'tests/e2e/settings-effects.spec.cjs'
      - '.github/workflows/settings-effects.yml'
permissions:
  contents: read
jobs:
  settings-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-chromium
      - name: Read-only settings and unchanged request contracts
        run: |
          node tests/settings-effects-core.cjs
          node tests/settings-effects-runtime.cjs
          node tests/request-feature-contract.cjs
          node tests/context-inspector-core.cjs
          node tests/context-inspector-revision.cjs
          node tests/reply-length-precedence-core.cjs
      - name: Scope, evidence and preferences on mobile and desktop
        run: npx playwright test tests/e2e/settings-effects.spec.cjs tests/e2e/request-feature-contract.spec.cjs tests/e2e/narrative-cache-preservation.spec.cjs tests/e2e/story-control-center.spec.cjs --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-effects-browser
          path: test-results/
