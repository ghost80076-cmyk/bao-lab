name: One-time Desire District anime world merge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-desire-anime-world.yml'

permissions:
  contents: write

jobs:
  merge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Merge world visuals and NPC generation without replacing current NPC logic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import json
          import subprocess
          from pathlib import Path

          path = Path('data/characters/general/desire-district.json')
          blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          assert blob == '595be6fb64f03edefc24ff8dafff60fff468be71', f'Character card changed since review: {blob}'
          card = json.loads(path.read_text(encoding='utf-8'))
          before = copy.deepcopy(card)

          visual = ('【世界觀視覺設定】本世界採用二次元動漫視覺風格。NPC 的身形、五官、髮型、服裝與氣質具有高度多樣性，'
                    '角色設計可參考各類 ACG 美術風格與人物屬性，呈現鮮明且各不相同的視覺辨識度。')
          world = card['content']['world']
          assert world.count('【三區與價格】') == 1
          assert '【世界觀視覺設定】' not in world
          card['content']['world'] = world.replace('【三區與價格】', visual + '\n【三區與價格】', 1)

          principle = ('【NPC 生成原則】生成新 NPC 時，可靈活組合哥德風、傲嬌、病嬌、眼鏡系、地雷系、知性系、冷豔系等風格與特質。'
                       '外觀、性格、職業、經歷及行為邏輯應分別建立，不得僅憑單一標籤決定人物的全部反應。'
                       '初次登場只呈現當下可觀察到的特徵，後續透過互動逐步展現人物個性，並保持設定連續性。')
          lore = card['content']['lore']
          assert lore.count('【原創二次元外觀詞庫】') == 1
          assert '【NPC 生成原則】' not in lore
          card['content']['lore'] = lore.replace('【原創二次元外觀詞庫】', principle + '\n【原創二次元外觀詞庫】', 1)

          focus = card['content']['world_focus']
          old_focus = '原創二次元成年角色視覺設計'
          assert focus.count(old_focus) == 1
          card['content']['world_focus'] = ['二次元動漫美術與多樣化 NPC 設計' if x == old_focus else x for x in focus]

          matches = [item for item in card['gameplay']['dynamic_prompts'] if item['id'] == 'district-anime-casting']
          assert len(matches) == 1
          casting = matches[0]
          casting['label'] = '二次元 NPC 造型與人物辨識'
          casting['text'] = ('需要新角色或換裝時，以二次元動漫視覺風格為美術方向；可靈活參考哥德風、傲嬌、病嬌、眼鏡系、地雷系、知性系、冷豔系等風格與特質，'
                             '並從身形、輪廓、五官、髮色、穿搭、材質、姿態、聲線中挑選2–4項，建立原創且彼此不同的角色辨識特徵。'
                             '外觀、性格、職業、經歷及行為邏輯分別建立，不能以單一外觀標籤推定年齡、能力、親密意願或服務內容。'
                             '初次登場只呈現當下可觀察到的特徵；人物個性經互動逐步展現，換裝與重逢維持設定連續性，不必每輪重送完整外觀資料。')

          assert card['gameplay']['initial_state'] == before['gameplay']['initial_state'], 'Do not change current NPC / status data'
          assert card['content']['greeting'] == before['content']['greeting'], 'Do not change the opening'
          assert card['content']['system_prompt'] == before['content']['system_prompt'], 'Do not change adult interaction or NPC presence rules'
          assert card['gameplay']['initial_state']['npcs'][0]['name'] == '貓姐兒'
          assert card['gameplay']['initial_state']['npcs'][0]['presence'] == 'present'
          assert '本世界採用二次元動漫視覺風格' in card['content']['world']
          assert '哥德風' in card['content']['lore'] and '眼鏡系' in casting['text']
          path.write_text(json.dumps(card, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Validated anime visual world, varied NPC casting and unchanged current-NPC state.')
          PY
          node tests/desire-district-core.cjs
          node tests/desire-district-current-npc.cjs
          node tests/character-status-core.cjs
          git diff --check
          rm .github/workflows/one-time-desire-anime-world.yml
          git add data/characters/general/desire-district.json .github/workflows/one-time-desire-anime-world.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Merge anime visual style and diverse NPC generation into Desire District'
          git push origin HEAD:main
