name: Pages live smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SITE_URL: https://yorubay.com/
      EXPECTED_TITLE: 夜灣 YoruBay｜AI 角色扮演、AI 聊天與世界模擬
    steps:
      - name: Wait for live Pages metadata
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 36); do
            html="$(curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}" || true)"
            if grep -Fq "<title>${EXPECTED_TITLE}</title>" <<<"${html}" \
              && grep -Fq '<link rel="canonical" href="https://yorubay.com/">' <<<"${html}" \
              && grep -Fq '<meta property="og:image" content="https://yorubay.com/assets/yorubay-og.jpg">' <<<"${html}" \
              && grep -Fq '<meta property="og:image:type" content="image/jpeg">' <<<"${html}" \
              && grep -Fq '<meta name="twitter:image" content="https://yorubay.com/assets/yorubay-og.jpg">' <<<"${html}" \
              && grep -Fq '<meta name="twitter:card" content="summary_large_image">' <<<"${html}"; then
              ok=1
              printf 'Live homepage metadata verified on attempt %s.\n' "${attempt}"
              break
            fi
            printf 'Waiting for the latest Pages content (attempt %s/36)...\n' "${attempt}"
            sleep 5
          done
          if [ "${ok}" -ne 1 ]; then
            printf 'Expected live homepage metadata was not observed.\n' >&2
            exit 1
          fi

      - name: Verify regex manager on public Pages
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            page="$(curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}regex-manager.html" || true)"
            adapter="$(curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}js/regex-chat.js" || true)"
            library="$(curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}js/regex-library.js" || true)"
            home="$(curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}" || true)"
            if grep -Fq '<title>正則管理器｜夜灣 YoruBay</title>' <<<"${page}" \
              && grep -Fq 'js/regex-library.js' <<<"${page}" \
              && grep -Fq 'window.BAORegexChat = { render, schedule }' <<<"${adapter}" \
              && grep -Fq 'bao-lab-display-regex-v1' <<<"${library}" \
              && grep -Fq 'js/regex-chat.js' <<<"${home}"; then
              ok=1
              printf 'Public Pages regex manager and chat adapter verified on attempt %s.\n' "$attempt"
              break
            fi
            printf 'Waiting for regex manager deployment (attempt %s/24)...\n' "$attempt"
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            printf 'Public Pages regex manager assets could not be verified.\n' >&2
            exit 1
          fi

      - name: Verify Gemini explicit cache on public Pages
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            loader="$(curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}js/prompt-cache.js" || true)"
            cache="$(curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}js/gemini-explicit-cache.js" || true)"
            if grep -Fq "script.src = 'js/gemini-explicit-cache.js?v=2'" <<<"${loader}" \
              && grep -Fq 'window.BAOGeminiExplicitCache = { open, inspect, create, remove }' <<<"${cache}" \
              && grep -Fq 'Gemini 顯式快取（進階）' <<<"${cache}"; then
              ok=1
              printf 'Public Pages Gemini explicit cache and loader verified on attempt %s.\n' "$attempt"
              break
            fi
            printf 'Waiting for Gemini explicit cache deployment (attempt %s/24)...\n' "$attempt"
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            printf 'Public Pages Gemini explicit cache assets could not be verified.\n' >&2
            exit 1
          fi

      - name: Verify cache cost panel on public Pages
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            loader="$(curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}js/global-bridge.js" || true)"
            panel="$(curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}js/cache-cost-panel.js" || true)"
            if grep -Fq "script.src = 'js/cache-cost-panel.js'" <<<"${loader}" \
              && grep -Fq 'window.BAOCacheCostPanel = { describeCache, estimateDifference, open, render }' <<<"${panel}" \
              && grep -Fq '快取與費用管理' <<<"${panel}"; then
              ok=1
              printf 'Public Pages cache cost panel and loader verified on attempt %s.\n' "$attempt"
              break
            fi
            printf 'Waiting for cache cost panel deployment (attempt %s/24)...\n' "$attempt"
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            printf 'Public Pages cache cost panel assets could not be verified.\n' >&2
            exit 1
          fi

      - name: Verify public author discovery
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            if python3 - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ["SITE_URL"]

          def get_text(path):
              request = urllib.request.Request(base + path, headers={"User-Agent": "YoruBay-Live-Smoke/1.0"})
              with urllib.request.urlopen(request, timeout=15) as response:
                  return response.read().decode("utf-8")

          home = get_text("")
          author_page = get_text("author")
          author_script = get_text("js/author-profile.js")
          author_core = get_text("js/author-profile-core.js")
          registry = json.loads(get_text("data/authors.json"))
          official = json.loads(get_text("data/characters.json"))
          manifest = json.loads(get_text("data/character-catalog/community/manifest.json"))

          community = []
          for page in manifest.get("pages", []):
              file = str(page.get("file") or "").strip()
              if file:
                  payload = json.loads(get_text(file))
                  if isinstance(payload, list):
                      community.extend(payload)

          assert '<a href="author">作者</a>' in home, "main navigation is missing the author directory"
          assert 'id="author-profile-root"' in author_page, "public author page shell is missing"
          assert 'js/author-profile-core.js' in author_page and 'js/author-profile.js' in author_page, "author page scripts are missing"
          assert 'function renderDirectory(' in author_script, "public author directory renderer is missing"
          assert 'author?id=' in author_script, "author cards no longer link to public profiles"
          assert 'function directoryEntries(' in author_core, "author directory core is missing"

          authors = registry.get("authors", []) if isinstance(registry, dict) else []
          author_ids = {str(author.get("id") or "").strip().lower() for author in authors if isinstance(author, dict)}
          required = {"banzhang", "chicofy", "ashboneai"}
          missing = sorted(required - author_ids)
          assert not missing, "registered public authors missing: " + ", ".join(missing)

          entries = [item for item in [*official, *community] if isinstance(item, dict)]
          assert entries, "public work catalog is empty"
          assert any(str(item.get("author_id") or "").strip().lower() == "banzhang" for item in entries), "no public works are linked to banzhang"

          for item in entries:
              work_id = str(item.get("id") or "").strip() or "<unknown>"
              author_id = str(item.get("author_id") or "").strip().lower()
              author_name = str(item.get("author") or "").strip()
              assert author_id, work_id + " is missing author_id"
              assert author_id in author_ids, work_id + " references unknown author_id " + author_id
              assert author_name, work_id + " is missing public author name"

          unique_works = {str(item.get("id") or "").strip() for item in entries if str(item.get("id") or "").strip()}
          print(f"Public author discovery verified: {len(author_ids)} authors, {len(unique_works)} unique works.")
          PY
            then
              ok=1
              printf 'Public author discovery verified on attempt %s.\n' "$attempt"
              break
            fi
            printf 'Waiting for public author discovery deployment (attempt %s/24)...\n' "$attempt"
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            printf 'Public author discovery could not be verified.\n' >&2
            exit 1
          fi

      - name: Verify robots and sitemap
        shell: bash
        run: |
          set -euo pipefail
          robots="$(curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}robots.txt")"
          sitemap="$(curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}sitemap.xml")"
          grep -Fq 'User-agent: *' <<<"${robots}"
          grep -Fq 'Allow: /' <<<"${robots}"
          grep -Fq 'Sitemap: https://yorubay.com/sitemap.xml' <<<"${robots}"
          grep -Fq '<loc>https://yorubay.com/</loc>' <<<"${sitemap}"
          grep -Fq '<loc>https://yorubay.com/quick-start</loc>' <<<"${sitemap}"
          grep -Fq '<loc>https://yorubay.com/api-guide</loc>' <<<"${sitemap}"
          grep -Fq '<loc>https://yorubay.com/author</loc>' <<<"${sitemap}"
          printf 'robots.txt and sitemap.xml verified.\n'

      - name: Verify social preview image
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            "${SITE_URL}assets/yorubay-og.jpg" -o /tmp/yorubay-og.jpg
          test -s /tmp/yorubay-og.jpg
          file /tmp/yorubay-og.jpg | grep -Fq 'JPEG image data'
          file /tmp/yorubay-og.jpg | grep -Eq '1200[[:space:]]*x[[:space:]]*630'
          printf 'Social preview image verified as a non-empty 1200x630 JPEG.\n'
