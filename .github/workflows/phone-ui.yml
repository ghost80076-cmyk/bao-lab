name: Optional Phone UI

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/phone-interaction-core.js'
      - 'tests/phone-interaction-core.test.cjs'
      - 'tests/e2e/phone-interactions.spec.cjs'
      - 'js/phone-ui*.js'
      - 'js/phone-story-*.js'
      - 'js/phone-player-*.js'
      - 'css/phone-ui.css'
      - 'js/character.js'
      - 'js/character-studio.js'
      - 'index.html'
      - 'character-studio.html'
      - 'tests/phone-ui.test.cjs'
      - 'tests/phone-story-core.test.cjs'
      - 'tests/phone-player-core.test.cjs'
      - 'tests/e2e/phone-ui.spec.cjs'
      - 'tests/e2e/phone-story-sync.spec.cjs'
      - 'tests/e2e/phone-player-settings.spec.cjs'
      - '.github/workflows/phone-ui.yml'
  push:
    branches: [main]
    paths:
      - 'js/phone-interaction-core.js'
      - 'tests/phone-interaction-core.test.cjs'
      - 'tests/e2e/phone-interactions.spec.cjs'
      - 'js/phone-ui*.js'
      - 'js/phone-story-*.js'
      - 'js/phone-player-*.js'
      - 'css/phone-ui.css'
      - 'js/character.js'
      - 'js/character-studio.js'
      - 'index.html'
      - 'character-studio.html'
      - 'tests/phone-ui.test.cjs'
      - 'tests/phone-story-core.test.cjs'
      - 'tests/phone-player-core.test.cjs'
      - 'tests/e2e/phone-ui.spec.cjs'
      - 'tests/e2e/phone-story-sync.spec.cjs'
      - 'tests/e2e/phone-player-settings.spec.cjs'
      - '.github/workflows/phone-ui.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check js/phone-interaction-core.js
          node --check js/phone-ui-core.js
          node --check js/phone-ui.js
          node --check js/phone-story-core.js
          node --check js/phone-story-bridge.js
          node --check js/phone-player-core.js
          node --check js/phone-player-settings.js
          node --check js/character-studio.js
          node --check js/character.js
          node --test tests/phone-interaction-core.test.cjs tests/phone-ui.test.cjs tests/phone-story-core.test.cjs tests/phone-player-core.test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test tests/e2e/phone-interactions.spec.cjs tests/e2e/phone-ui.spec.cjs tests/e2e/phone-story-sync.spec.cjs tests/e2e/phone-player-settings.spec.cjs --project=chromium

      - name: Save phone browser results and responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-ui-browser-report
          path: |
            playwright-report
            test-results
          retention-days: 3
          if-no-files-found: ignore
