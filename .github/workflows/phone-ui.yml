name: Optional Phone UI

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/phone-ui*.js'
      - 'css/phone-ui.css'
      - 'js/character.js'
      - 'js/character-studio.js'
      - 'index.html'
      - 'character-studio.html'
      - 'tests/phone-ui.test.cjs'
      - 'tests/e2e/phone-ui.spec.cjs'
      - '.github/workflows/phone-ui.yml'
  push:
    branches: [main]
    paths:
      - 'js/phone-ui*.js'
      - 'css/phone-ui.css'
      - 'js/character.js'
      - 'js/character-studio.js'
      - 'index.html'
      - 'character-studio.html'
      - 'tests/phone-ui.test.cjs'
      - 'tests/e2e/phone-ui.spec.cjs'
      - '.github/workflows/phone-ui.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check js/phone-ui-core.js
          node --check js/phone-ui.js
          node --check js/character-studio.js
          node --check js/character.js
          node --test tests/phone-ui.test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test tests/e2e/phone-ui.spec.cjs --project=chromium
