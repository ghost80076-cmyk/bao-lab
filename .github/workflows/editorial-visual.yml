name: BAO editorial visual review
on:
  push:
    branches: [main]
    paths:
      - 'css/bao-cinematic-home.css'
      - 'css/bao-editorial-cinema.css'
      - 'js/brand-ui.js'
      - 'js/bao-visual-ui.js'
      - 'tests/e2e/community-brand.spec.cjs'
      - 'tests/e2e/reading-bookshelf.spec.cjs'
      - 'tests/e2e/editorial-visual.spec.cjs'
      - '.github/workflows/editorial-visual.yml'
      - '.github/actions/setup-chromium/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'css/bao-cinematic-home.css'
      - 'css/bao-editorial.css'
      - 'css/bao-editorial-polish.css'
      - 'css/bao-editorial-cinema.css'
      - 'js/bao-gallery-focus.js'
      - 'js/bookshelf-enhance.js'
      - 'js/bao-visual-ui.js'
      - 'js/brand-ui.js'
      - 'js/site-ui.js'
      - 'js/character-ui.js'
      - 'tests/e2e/community-brand.spec.cjs'
      - 'tests/e2e/reading-bookshelf.spec.cjs'
      - 'tests/e2e/editorial-visual.spec.cjs'
      - '.github/workflows/editorial-visual.yml'
      - '.github/actions/setup-chromium/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
jobs:
  visual-and-functional-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture responsive pages and check original reading actions
        run: npx playwright test --project=chromium tests/e2e/editorial-visual.spec.cjs tests/e2e/reading-bookshelf.spec.cjs tests/e2e/community-brand.spec.cjs
      - name: Upload screenshots for visual approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-editorial-visual-review
          path: |
            test-results/editorial/*.png
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
