name: One-time Claude cache model binding apply

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-claude-cache-model-binding-apply.yml

permissions:
  contents: read

concurrency:
  group: claude-cache-model-binding-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify registry and deploy plan
        run: |
          set -euo pipefail
          node tests/model-registry-contract.cjs
          node tests/model-deployment-plan-core.cjs
          node tests/hosted-mainstream-rollout-core.cjs
          node tests/production-model-binding-deploy-core.cjs

      - name: Apply production model bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          YORUBAY_MODEL_BINDINGS_APPLY: APPLY_REGISTRY_MODEL_BINDINGS
        run: node scripts/apply-production-model-registry.cjs

      - name: Verify production registry
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
        run: node scripts/audit-production-model-registry.cjs
