name: Credits pilot frontend verification

on:
  push:
    branches: [main]
    paths:
      - js/credits-pilot.js
      - js/global-bridge.js
      - tests/credits-pilot.test.cjs
      - tests/credits-pilot-413-core.cjs
      - .github/workflows/credits-pilot-integration.yml
  pull_request:
    branches: [main]
    paths:
      - js/credits-pilot.js
      - js/global-bridge.js
      - tests/credits-pilot.test.cjs
      - tests/credits-pilot-413-core.cjs
      - .github/workflows/credits-pilot-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-live-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local adapter and isolation
        run: |
          node --check js/credits-pilot.js
          node --check js/global-bridge.js
          node --test tests/credits-pilot.test.cjs
          node --test tests/credits-pilot-413-core.cjs
      - name: Verify deployed Pages adapter and loader
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='https://ghost80076-cmyk.github.io/bao-lab/js'
          adapter_file="$(mktemp)"
          loader_file="$(mktemp)"
          trap 'rm -f "$adapter_file" "$loader_file"' EXIT
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location --max-time 15 \
                "${base}/credits-pilot.js?ci=${GITHUB_SHA}" -o "$adapter_file" \
              && curl --fail --silent --show-error --location --max-time 15 \
                "${base}/global-bridge.js?ci=${GITHUB_SHA}" -o "$loader_file" \
              && cmp -s js/credits-pilot.js "$adapter_file" \
              && cmp -s js/global-bridge.js "$loader_file"; then
              printf 'Credits pilot and loader are live on Pages (attempt %s).\n' "$attempt"
              exit 0
            fi
            sleep 5
          done
          printf 'New credits pilot assets were not observed on live Pages.\n' >&2
          exit 1
