name: Credits pilot frontend verification

on:
  push:
    branches: [main]
    paths:
      - js/credits-pilot.js
      - js/global-bridge.js
      - tests/credits-pilot.test.cjs
      - tests/credits-pilot-413-core.cjs
      - .github/workflows/credits-pilot-integration.yml
      - scripts/verify-live-assets.sh
      - tests/live-assets-verifier.test.cjs
  pull_request:
    branches: [main]
    paths:
      - js/credits-pilot.js
      - js/global-bridge.js
      - tests/credits-pilot.test.cjs
      - tests/credits-pilot-413-core.cjs
      - .github/workflows/credits-pilot-integration.yml
      - scripts/verify-live-assets.sh
      - tests/live-assets-verifier.test.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-live-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local adapter and isolation
        run: |
          node --check js/credits-pilot.js
          node --check js/global-bridge.js
          node --test tests/credits-pilot.test.cjs
          node --test tests/credits-pilot-413-core.cjs
      - name: Verify deployed Pages adapter and loader
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SITE_URL: https://ghost80076-cmyk.github.io/bao-lab/
          LIVE_VERIFY_QUERY: ci
        run: bash scripts/verify-live-assets.sh js/credits-pilot.js js/global-bridge.js
