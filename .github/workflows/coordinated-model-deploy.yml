name: Coordinated production model registry sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Review dry-run first; apply requires explicit confirmation and current fingerprint
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      expected_commit_sha:
        description: Apply only - exact main commit SHA reviewed during the dry-run
        required: false
        type: string
      expected_current_sha256:
        description: Apply only - CURRENT_SHA256 from the latest AWS dry-run
        required: false
        type: string
      confirmation:
        description: Apply only - enter APPLY_REGISTRY_MODEL_BINDINGS
        required: false
        type: string

permissions:
  contents: read
  id-token: write

# Serialize with existing production Worker deploys.
concurrency:
  group: production-worker
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed model catalog
        uses: actions/checkout@v4

      - name: Guard production branch and explicit apply approval
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit_sha }}
          EXPECTED_CURRENT: ${{ inputs.expected_current_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ github.ref }}' != 'refs/heads/main' ]]; then
            echo 'Production model sync must run from main' >&2
            exit 2
          fi
          echo "REVIEWED_MAIN_SHA=${{ github.sha }}"
          if [[ "$MODE" == 'apply' ]]; then
            if [[ "$CONFIRMATION" != 'APPLY_REGISTRY_MODEL_BINDINGS' || "$EXPECTED_COMMIT" != '${{ github.sha }}' || ! "$EXPECTED_CURRENT" =~ ^[a-f0-9]{64}$ ]]; then
              echo 'Apply blocked: exact main SHA, live AWS fingerprint and explicit confirmation required' >&2
              exit 2
            fi
          elif [[ "$MODE" != 'dry-run' ]]; then
            echo 'Unknown sync mode' >&2
            exit 2
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment contracts
        run: |
          python3 -m py_compile scripts/aws-model-allowlist-remote.py
          bash -n scripts/run-aws-model-sync.sh
          node tests/aws-model-sync-deploy-core.cjs
          node tests/model-deployment-plan-core.cjs
          node tests/production-model-registry-audit-core.cjs
          node tests/production-model-binding-deploy-core.cjs

      - name: Configure temporary AWS SSM credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::746698923199:role/YoruBayGitHubDeploy
          aws-region: ap-southeast-2
          role-session-name: yorubay-model-registry-sync

      - name: Read-only AWS relay model fingerprint
        if: inputs.mode == 'dry-run'
        run: bash scripts/run-aws-model-sync.sh dry-run

      - name: Read-only Cloudflare Worker model binding plan
        if: inputs.mode == 'dry-run'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
        run: node scripts/apply-production-model-registry.cjs

      - name: Apply AWS relay model allowlist first
        if: inputs.mode == 'apply'
        id: aws_apply
        env:
          EXPECTED_CURRENT: ${{ inputs.expected_current_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/yorubay-model-aws-apply.out"
          bash scripts/run-aws-model-sync.sh apply "$EXPECTED_CURRENT" | tee "$output"
          if grep -qx 'RESULT=changed' "$output"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Cloudflare model binding version with built-in rollback
        if: inputs.mode == 'apply'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          YORUBAY_MODEL_BINDINGS_APPLY: ${{ inputs.confirmation }}
        run: node scripts/apply-production-model-registry.cjs

      - name: Compensate AWS update if Cloudflare deployment fails
        # The Cloudflare script performs its own version rollback if its
        # post-deployment audit fails. Only this run's AWS write is undone.
        if: ${{ failure() && inputs.mode == 'apply' && steps.aws_apply.outputs.changed == 'true' }}
        run: bash scripts/run-aws-model-sync.sh rollback
