name: Journey visual audit
on:
  pull_request:
    paths:
      - 'tests/e2e/journey-visual-audit.spec.cjs'
      - '.github/workflows/journey-visual-audit.yml'
      - 'css/**'
      - 'js/**'
      - '*.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test tests/e2e/journey-visual-audit.spec.cjs --project=chromium --workers=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-visual-audit
          path: |
            test-results/
            playwright-report/
          retention-days: 14
