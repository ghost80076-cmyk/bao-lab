name: Core tests

on:
  push:
    branches:
      - main
      - feat/indexeddb-story-storage
      - feat/story-library-model
      - feat/character-readiness
      - feat/model-guide-and-api-presets
      - feat-story-reader-rebuild
      - fix-story-reader-desktop-layout
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Author status binding and persistence
        run: node tests/author-status-binding-core.cjs
      - name: Character status core
        run: node tests/character-status-core.cjs
      - name: Native mature status pack
        run: node tests/native-status-packs-core.cjs
      - name: World template and usage integrity
        run: node tests/status-usage-integrity-core.cjs
      - name: Story integrity and NPC state regression
        run: node tests/story-integrity-core.cjs
      - name: Story flow core
        run: node tests/story-flow-core.cjs
      - name: Context Pack resumable organization
        run: node tests/context-pack-resume-core.cjs
      - name: Story Reader core
        run: node tests/story-reader-core.cjs
      - name: Story revision state consistency
        run: node tests/story-revision-state-core.cjs
      - name: IndexedDB storage migration
        run: node tests/storage-indexeddb-core.cjs
      - name: Story library core
        run: node tests/story-library-core.cjs
      - name: Long story 3000-round stress
        run: node tests/long-story-stress-core.cjs
      - name: Story bundle backup
        run: node tests/story-backup-core.cjs
      - name: Legacy BAO/LAB to YoruBay compatibility
        run: node tests/legacy-brand-compat-core.cjs
      - name: Story backup corruption and rollback
        run: node tests/story-backup-recovery-core.cjs
      - name: Story bundle nested credential sanitization
        run: node tests/story-bundle-secret-core.cjs
      - name: Character readiness core
        run: node tests/character-readiness-core.cjs
      - name: Character role boundaries
        run: node tests/character-role-boundaries-core.cjs
      - name: Character studio creation flow
        run: |
          node --check js/character-studio-flow-core.js
          node --check js/character-studio-flow.js
          node tests/character-studio-flow-core.cjs
      - name: Character studio lifecycle
        run: |
          node --check js/character-studio-lifecycle-core.js
          node --check js/character-studio-lifecycle.js
          node tests/character-studio-lifecycle-core.cjs
      - name: Unhealed Bonds card
        run: node tests/unhealed-bonds-card.test.cjs
      - name: Host Club Simulator card
        run: node tests/host-club-simulator-card.test.cjs
      - name: Night Sky Magic Academy card
        run: node tests/night-sky-magic-academy-card.test.cjs
      - name: K-idol survival simulator card
        run: node tests/k-idol-survival-simulator-card.test.cjs
      - name: BAO Doctor static diagnostics
        run: node tests/bao-doctor-core.cjs
      - name: Lazy character catalog
        run: node tests/character-catalog-lazy-core.cjs
      - name: Explore discovery filters and work versions
        run: |
          node --check js/explore-discovery-core.js
          node --check js/explore-discovery.js
          node tests/explore-discovery-core.cjs
      - name: Author profile core
        run: |
          node --check js/author-profile-core.js
          node --check js/author-profile.js
          node tests/author-profile-core.cjs
          node tests/catalog-version-metadata.cjs
      - name: Character JSON import hardening
        run: node tests/character-import-core.cjs
      - name: Admin character publication
        run: |
          node tests/admin-character-publish-core.cjs
          node tests/admin-character-publish-update.cjs
          node tests/admin-author-profile-publish.cjs
          node tests/admin-author-profile-update.cjs
      - name: Author structure guidance and relay probe
        run: node tests/author-diagnostics-core.cjs
      - name: Model presets and routing
        run: node tests/model-presets-core.cjs
      - name: YoruBay invited credits bridge
        run: |
          node --check js/credits-pilot.js
          node --test tests/credits-pilot.test.cjs
      - name: YoruBay package pricing consistency
        run: node tests/yorubay-package-pricing-core.cjs
      - name: YoruBay zero-cost model billing
        run: node tests/worker-free-model-billing-core.cjs
      - name: YoruBay OpenRouter price guard
        run: node tests/worker-openrouter-cost-guard-core.cjs
      - name: Mainstream Hosted rollout pricing
        run: node tests/hosted-mainstream-rollout-core.cjs
      - name: Worker model config shards
        run: node tests/worker-model-config-shards-core.cjs
      - name: YoruBay provider control
        run: node tests/provider-control-core.cjs
      - name: Worker response security headers
        run: node tests/worker-security-headers-core.cjs
      - name: Worker session security contract
        run: node tests/worker-session-security-contract.cjs
      - name: Frontend extension idempotency
        run: |
          node --check js/world-modules.js
          node --check js/story-tools.js
          node tests/frontend-idempotency-core.cjs
      - name: Prompt pipeline idempotency
        run: |
          node --check js/prompt-cache.js
          node --check js/prompt-orchestrator.js
          node tests/prompt-pipeline-idempotency.cjs
      - name: YoruBay admin player list
        run: node tests/admin-player-list-core.cjs
      - name: YoruBay admin account status
        run: node tests/admin-account-status-core.cjs
      - name: YoruBay account author identity
        run: |
          node tests/account-author-identity.cjs
          node --check workers/bao-lab-credits-api/worker.js
      - name: Canon workbench
        run: node tests/canon-workbench-core.cjs
      - name: Mature narrative and character agency settings
        run: node tests/narrative-settings-core.cjs
      - name: Narrative selection to final request pipeline
        run: node tests/narrative-prompt-pipeline-core.cjs
      - name: Stable chat message IDs
        run: node tests/chat-message-id-core.cjs
      - name: Local conversation search
        run: node tests/conversation-search-core.cjs
      - name: Story start readiness
        run: |
          node --check js/story-start-readiness-core.js
          node --check js/story-start-readiness.js
          node tests/story-start-readiness-core.cjs
      - name: Current story control center
        run: |
          node --check js/story-control-center-core.js
          node --check js/story-control-center.js
          node tests/story-control-center-core.cjs
      - name: Story extension scopes
        run: |
          node --check js/story-extensions-core.js
          node --check js/story-extensions-center.js
          node tests/story-extensions-core.cjs
      - name: Portable story extension packs
        run: |
          node --check js/story-extension-pack-core.js
          node --check js/story-extension-pack.js
          node tests/story-extension-pack-core.cjs
      - name: Player-facing context health
        run: |
          node --check js/context-health-core.js
          node --check js/context-health.js
          node tests/context-health-core.cjs
      - name: Story quick commands
        run: |
          node --check js/story-quick-commands-core.js
          node --check js/story-quick-commands.js
          node tests/story-quick-commands-core.cjs
      - name: Provider request contracts
        run: node tests/api-provider-contracts.cjs
      - name: Provider failure and cancellation contracts
        run: node tests/api-failure-contracts.cjs
      - name: Bounded API retry contracts
        run: node tests/api-retry-contracts.cjs
      - name: Provider browser diagnostics
        run: node tests/provider-diagnostics-core.cjs
      - name: Provider streaming contracts
        run: node tests/api-streaming-contracts.cjs
      - name: Helper API connection diagnostics
        run: node tests/helper-api-diagnostics-core.cjs
      - name: Generation request lifecycle
        run: node tests/request-lifecycle-core.cjs
      - name: Accumulated world state turns
        run: node tests/world-state-cost-core.cjs
      - name: Same-model story and state merge
        run: node tests/same-model-state-merge-core.cjs
      - name: Display-independent state tracking
        run: node tests/display-state-tracking-core.cjs
      - name: Explicit scene metadata and greeting recovery
        run: node tests/explicit-scene-state-core.cjs
      - name: Prompt cache pipeline
        run: node tests/prompt-cache-core.cjs
      - name: Prompt orchestration adapters
        run: node tests/prompt-orchestrator-core.cjs
      - name: Cache cost panel
        run: node tests/cache-cost-panel-core.cjs
      - name: Per-request multi-model cost accounting
        run: node tests/per-request-cost-core.cjs
      - name: Memory request isolation and cooldown
        run: node tests/memory-request-guard-core.cjs
      - name: Helper context isolation and memory lifecycle
        run: node tests/helper-context-core.cjs
      - name: Memory app greeting and post-turn integrity
        run: node tests/memory-app-integrity-core.cjs
      - name: Contextual lorebook and legacy compatibility
        run: node tests/lorebook-core.cjs
      - name: Yume world-card relevant context
        run: node tests/yume-relevant-context.cjs
