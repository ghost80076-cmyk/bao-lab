name: Core tests

on:
  push:
    branches:
      - main
      - feat/indexeddb-story-storage
      - feat/story-library-model
      - feat/character-readiness
      - feat/model-guide-and-api-presets
      - feat-story-reader-rebuild
      - fix-story-reader-desktop-layout
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model registry consolidation contract
        run: node tests/model-registry-contract-core.cjs
      - name: Existing core suite
        run: |
          set -e
          for test in tests/*core.cjs tests/*.test.cjs; do
            [ -f "$test" ] || continue
            [ "$test" = "tests/model-registry-contract-core.cjs" ] && continue
            node "$test"
          done
