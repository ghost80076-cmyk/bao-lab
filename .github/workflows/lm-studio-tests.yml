name: LM Studio local provider
on:
  push:
    branches: [main, feat/lm-studio-local-provider]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  local-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and local transport contract
        run: |
          node --check js/lm-studio-core.js
          node --check js/lm-studio.js
          node --check js/helper-api-routing.js
          node tests/lm-studio-core.cjs
      - name: Verify guide and script loading
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const load = fs.readFileSync('js/helper-api-routing.js', 'utf8');
          const lm = fs.readFileSync('js/lm-studio.js', 'utf8');
          const discovery = fs.readFileSync('js/model-discovery.js', 'utf8');
          const guide = fs.readFileSync('lm-studio-guide.html', 'utf8');
          const ok =
            load.includes('js/lm-studio-core.js') &&
            load.includes('js/lm-studio.js') &&
            lm.includes('bao-lm-endpoint') &&
            lm.includes('http://127.0.0.1:1234/v1') &&
            lm.includes("genericModelLabel.hidden = selected") &&
            lm.includes("connectionSummary.hidden = selected") &&
            discovery.includes('bao-builder-model-discovery') &&
            discovery.includes("preset?.route === 'custom'") &&
            discovery.includes("value === 'lmstudio'") &&
            guide.includes('Enable CORS') &&
            guide.includes('Settings → Developer') &&
            guide.includes('Start Server');
          if (!ok) process.exit(1);
          NODE
