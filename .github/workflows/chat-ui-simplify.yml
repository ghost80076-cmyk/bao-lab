name: Compact chat UI regression
on:
  pull_request:
    paths:
      - 'js/chat-ui-simplify.js'
      - 'js/chat-controls-clarity.js'
      - 'js/story-entry-visibility.js'
      - 'js/author-regex-mobile.js'
      - 'css/chat-desktop-reading.css'
      - 'tests/e2e/chat-ui-simplify.spec.cjs'
      - 'tests/e2e/chat-controls-clarity.spec.cjs'
      - 'tests/e2e/chat-tablet-access.spec.cjs'
      - 'tests/e2e/story-entry-visibility.spec.cjs'
      - 'tests/e2e/chat-desktop-reading.spec.cjs'
      - '.github/workflows/chat-ui-simplify.yml'
  workflow_dispatch:
jobs:
  focused-browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check compact UI, story entries and existing author behavior on Chromium
        run: npx playwright test --project=chromium tests/e2e/chat-ui-simplify.spec.cjs tests/e2e/chat-controls-clarity.spec.cjs tests/e2e/chat-tablet-access.spec.cjs tests/e2e/story-entry-visibility.spec.cjs tests/e2e/chat-desktop-reading.spec.cjs tests/e2e/author-regex-dock.spec.cjs tests/e2e/author-regex-compat.spec.cjs
