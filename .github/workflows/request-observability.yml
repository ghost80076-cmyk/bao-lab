name: Request observability and NPC timelines
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-chromium
      - name: Accounting, request capture and NPC source isolation
        run: |
          node tests/request-observability-core.cjs
          node tests/context-inspector-core.cjs
          node tests/context-source-decisions-core.cjs
          node tests/canon-workbench-core.cjs
          node tests/lorebook-core.cjs
          node tests/npc-timeline-core.cjs
          node tests/npc-timeline-sources-core.cjs
          node tests/npc-timeline-resolution-core.cjs
          node tests/same-model-state-merge-core.cjs
          node tests/world-state-cost-core.cjs
          node tests/worker-wallet-reservations-core.cjs
          node tests/worker-admin-usage-routes-core.cjs
          node tests/worker-provider-transport-core.cjs
          node tests/episodic-memory-core.cjs
          node tests/actor-alias-core.cjs
          node tests/actor-alias-runtime.cjs
          node scripts/evaluate-episodic-recall.cjs --report benchmark-results/recall-acceptance.json
          node scripts/evaluate-episodic-recall.cjs --fixture tests/fixtures/recall-acceptance/trust-heldout.json --report benchmark-results/recall-trust-heldout.json
          node tests/recall-acceptance-runner-core.cjs
          node tests/worldbook-library-core.cjs
          node tests/frontend-extension-contract.cjs
      - name: Mobile and desktop interaction
        run: npm run test:e2e -- tests/e2e/request-inspector-timeline.spec.cjs tests/e2e/context-health.spec.cjs tests/e2e/npc-presence-roundtrip.spec.cjs --project=chromium
      - name: Screenshots and browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: request-observability-browser
          path: |
            test-results/
            playwright-report/
            benchmark-results/
          retention-days: 7
