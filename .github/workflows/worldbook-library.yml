name: Worldbook library MVP

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/worldbook-library*.js'
      - 'js/character.js'
      - 'js/state.js'
      - 'js/storage.js'
      - 'tests/sunrise-prompt-layering-core.cjs'
      - 'data/worldbook-library.json'
      - 'data/sunrise-worldbook-library.json'
      - 'data/sunrise-geography-source-map.json'
      - 'tests/sunrise-geography-core.cjs'
      - 'tests/sunrise-migration-coverage.cjs'
      - 'data/sunrise-migration-coverage.json'
      - 'scripts/audit-sunrise-migration.py'
      - 'scripts/sunrise_reconciliation.py'
      - 'scripts/plan-sunrise-integration.py'
      - 'data/sunrise-integration-plan.json'
      - 'data/sunrise-native-blueprint.json'
      - 'tests/sunrise-integration-core.cjs'
      - 'tests/sunrise-reconciliation.py'
      - 'scripts/migrate-sunrise-geography.py'
      - 'data/three-realms-worldbook-source-map.json'
      - 'data/three-realms-encyclopedia-source-map.json'
      - 'data/three-realms-lower-atlas-source-map.json'
      - 'data/three-realms-middle-lore-source-map.json'
      - 'data/three-realms-advanced-lore-source-map.json'
      - 'data/three-realms-cosmic-lore-source-map.json'
      - 'data/three-realms-secret-lore-source-map.json'
      - 'scripts/migrate-three-realms-secret-lore.py'
      - 'tests/three-realms-secret-lore-core.cjs'
      - 'scripts/migrate-three-realms-cosmic-lore.py'
      - 'tests/three-realms-cosmic-lore-core.cjs'
      - 'scripts/migrate-three-realms-advanced-lore.py'
      - 'tests/three-realms-advanced-lore-core.cjs'
      - 'scripts/migrate-three-realms-middle-lore.py'
      - 'tests/three-realms-middle-lore-core.cjs'
      - 'scripts/migrate-three-realms-lower-atlas.py'
      - 'tests/three-realms-lower-atlas-core.cjs'
      - 'scripts/migrate-three-realms-encyclopedia.py'
      - 'tests/three-realms-encyclopedia-core.cjs'
      - 'scripts/migrate-three-realms-worldbook.py'
      - 'tests/three-realms-worldbook-core.cjs'
      - 'tests/worldbook-library-core.cjs'
      - 'tests/worldbook-library-runtime.cjs'
      - 'js/site-ui.js'
      - '.github/workflows/worldbook-library.yml'
  push:
    branches: [main]
    paths:
      - 'js/worldbook-library*.js'
      - 'js/character.js'
      - 'js/state.js'
      - 'js/storage.js'
      - 'tests/sunrise-prompt-layering-core.cjs'
      - 'data/worldbook-library.json'
      - 'data/sunrise-worldbook-library.json'
      - 'data/sunrise-geography-source-map.json'
      - 'tests/sunrise-geography-core.cjs'
      - 'tests/sunrise-migration-coverage.cjs'
      - 'data/sunrise-migration-coverage.json'
      - 'scripts/audit-sunrise-migration.py'
      - 'scripts/sunrise_reconciliation.py'
      - 'scripts/plan-sunrise-integration.py'
      - 'data/sunrise-integration-plan.json'
      - 'data/sunrise-native-blueprint.json'
      - 'tests/sunrise-integration-core.cjs'
      - 'tests/sunrise-reconciliation.py'
      - 'scripts/migrate-sunrise-geography.py'
      - 'data/three-realms-worldbook-source-map.json'
      - 'data/three-realms-encyclopedia-source-map.json'
      - 'data/three-realms-lower-atlas-source-map.json'
      - 'data/three-realms-middle-lore-source-map.json'
      - 'data/three-realms-advanced-lore-source-map.json'
      - 'data/three-realms-cosmic-lore-source-map.json'
      - 'data/three-realms-secret-lore-source-map.json'
      - 'scripts/migrate-three-realms-secret-lore.py'
      - 'tests/three-realms-secret-lore-core.cjs'
      - 'scripts/migrate-three-realms-cosmic-lore.py'
      - 'tests/three-realms-cosmic-lore-core.cjs'
      - 'scripts/migrate-three-realms-advanced-lore.py'
      - 'tests/three-realms-advanced-lore-core.cjs'
      - 'scripts/migrate-three-realms-middle-lore.py'
      - 'tests/three-realms-middle-lore-core.cjs'
      - 'scripts/migrate-three-realms-lower-atlas.py'
      - 'tests/three-realms-lower-atlas-core.cjs'
      - 'scripts/migrate-three-realms-encyclopedia.py'
      - 'tests/three-realms-encyclopedia-core.cjs'
      - 'scripts/migrate-three-realms-worldbook.py'
      - 'tests/three-realms-worldbook-core.cjs'
      - 'tests/worldbook-library-core.cjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and worldbook recall tests
        run: |
          node --check js/worldbook-library-core.js
          node --check js/worldbook-library.js
          node tests/worldbook-library-core.cjs
          node tests/sunrise-geography-core.cjs
          node tests/sunrise-migration-coverage.cjs
          node tests/sunrise-integration-core.cjs
          python tests/sunrise-reconciliation.py
          node tests/worldbook-library-runtime.cjs
          node tests/sunrise-prompt-layering-core.cjs
          node tests/three-realms-worldbook-core.cjs
          node tests/three-realms-encyclopedia-core.cjs
          node tests/three-realms-lower-atlas-core.cjs
          node tests/three-realms-middle-lore-core.cjs
          node tests/three-realms-advanced-lore-core.cjs
          node tests/three-realms-cosmic-lore-core.cjs
          node tests/three-realms-secret-lore-core.cjs
          node tests/lorebook-core.cjs
