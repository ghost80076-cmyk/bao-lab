name: Worldbook library MVP

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/worldbook-library*.js'
      - 'data/worldbook-library.json'
      - 'data/three-realms-worldbook-source-map.json'
      - 'data/three-realms-encyclopedia-source-map.json'
      - 'data/three-realms-lower-atlas-source-map.json'
      - 'data/three-realms-middle-lore-source-map.json'
      - 'scripts/migrate-three-realms-middle-lore.py'
      - 'tests/three-realms-middle-lore-core.cjs'
      - 'scripts/migrate-three-realms-lower-atlas.py'
      - 'tests/three-realms-lower-atlas-core.cjs'
      - 'scripts/migrate-three-realms-encyclopedia.py'
      - 'tests/three-realms-encyclopedia-core.cjs'
      - 'scripts/migrate-three-realms-worldbook.py'
      - 'tests/three-realms-worldbook-core.cjs'
      - 'tests/worldbook-library-core.cjs'
      - 'tests/worldbook-library-runtime.cjs'
      - 'js/site-ui.js'
      - '.github/workflows/worldbook-library.yml'
  push:
    branches: [main]
    paths:
      - 'js/worldbook-library*.js'
      - 'data/worldbook-library.json'
      - 'data/three-realms-worldbook-source-map.json'
      - 'data/three-realms-encyclopedia-source-map.json'
      - 'data/three-realms-lower-atlas-source-map.json'
      - 'data/three-realms-middle-lore-source-map.json'
      - 'scripts/migrate-three-realms-middle-lore.py'
      - 'tests/three-realms-middle-lore-core.cjs'
      - 'scripts/migrate-three-realms-lower-atlas.py'
      - 'tests/three-realms-lower-atlas-core.cjs'
      - 'scripts/migrate-three-realms-encyclopedia.py'
      - 'tests/three-realms-encyclopedia-core.cjs'
      - 'scripts/migrate-three-realms-worldbook.py'
      - 'tests/three-realms-worldbook-core.cjs'
      - 'tests/worldbook-library-core.cjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and worldbook recall tests
        run: |
          node --check js/worldbook-library-core.js
          node --check js/worldbook-library.js
          node tests/worldbook-library-core.cjs
          node tests/worldbook-library-runtime.cjs
          node tests/three-realms-worldbook-core.cjs
          node tests/three-realms-encyclopedia-core.cjs
          node tests/three-realms-lower-atlas-core.cjs
          node tests/three-realms-middle-lore-core.cjs
          node tests/lorebook-core.cjs
