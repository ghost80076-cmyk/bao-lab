permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and worldbook recall tests
        run: |
          node --check js/worldbook-library-core.js
          node --check js/worldbook-library.js
          node tests/worldbook-library-core.cjs
          node tests/sunrise-geography-core.cjs
          node tests/sunrise-migration-coverage.cjs
          node tests/sunrise-integration-core.cjs
          python tests/sunrise-reconciliation.py
          node tests/worldbook-library-runtime.cjs
          node tests/sunrise-prompt-layering-core.cjs
          node tests/three-realms-worldbook-core.cjs
          node tests/three-realms-encyclopedia-core.cjs
          node tests/three-realms-lower-atlas-core.cjs
          node tests/three-realms-middle-lore-core.cjs
          node tests/three-realms-advanced-lore-core.cjs
          node tests/three-realms-cosmic-lore-core.cjs
          node tests/three-realms-secret-lore-core.cjs
          node tests/lorebook-core.cjs

  sunrise-live-assets:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed Sunrise files match this commit
        run: |
          python - <<'PY'
          import hashlib, pathlib, time, urllib.request
          paths = [
              "index.html", "js/character.js", "js/state.js", "js/storage.js",
              "js/site-ui.js", "js/worldbook-library.js",
              "data/sunrise-worldbook-library.json",
              "data/characters/community/73/sunrise-city-disorder.json",
          ]
          pending = set(paths)
          for attempt in range(36):
              for path in list(pending):
                  try:
                      request = urllib.request.Request("https://yorubay.com/" + path + "?verify=" + str(time.time_ns()), headers={"Cache-Control": "no-cache"})
                      with urllib.request.urlopen(request, timeout=10) as response:
                          live = response.read()
                      if hashlib.sha256(live).digest() == hashlib.sha256(pathlib.Path(path).read_bytes()).digest():
                          pending.remove(path)
                          print("Verified deployed asset:", path, flush=True)
                  except Exception as error:
                      print("Waiting:", path, type(error).__name__, flush=True)
              if not pending:
                  break
              time.sleep(5)
          if pending:
              raise SystemExit("Deployed assets differ from this commit: " + ", ".join(sorted(pending)))
          PY
