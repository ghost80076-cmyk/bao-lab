name: One-time Gemma production sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-gemma-production-sync.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-worker
  cancel-in-progress: false

jobs:
  cloudflare-model-bindings:
    if: contains(github.event.head_commit.message, 'one-time Gemma production sync')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify guarded model binding apply contracts
        run: |
          node --check scripts/apply-worker-model-bindings.cjs
          node tests/worker-model-binding-apply-core.cjs
          node tests/model-deployment-plan-core.cjs
          node tests/production-model-registry-audit-core.cjs

      - name: Read current production binding fingerprint
        id: binding-dry-run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-worker-model-bindings.cjs > /tmp/model-binding-dry-run.json
          cat /tmp/model-binding-dry-run.json
          FINGERPRINT="$(
            node -e "const r=require('/tmp/model-binding-dry-run.json'); process.stdout.write(r.current_fingerprint)"
          )"
          test "${#FINGERPRINT}" -eq 64
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Apply only registry-generated model bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          CURRENT_FINGERPRINT: ${{ steps.binding-dry-run.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-worker-model-bindings.cjs             --apply             "--expect-current=$CURRENT_FINGERPRINT"

      - name: Verify Cloudflare production registry
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
        run: node scripts/audit-production-model-registry.cjs

  aws-relay-models:
    if: contains(github.event.head_commit.message, 'one-time Gemma production sync')
    needs: cloudflare-model-bindings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::746698923199:role/YoruBayGitHubDeploy
          aws-region: ap-southeast-2
          role-session-name: yorubay-gemma-model-sync

      - name: Build expected OpenRouter relay allowlist
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(
            node -e "const {buildModelDeploymentPlan,loadRegistry}=require('./workers/bao-lab-credits-api/build-model-deployment-plan.cjs');process.stdout.write(buildModelDeploymentPlan(loadRegistry()).aws.value_csv)"
          )"
          test -n "$EXPECTED"
          case ",$EXPECTED," in
            *,google/gemma-4-31b-it,*) ;;
            *)
              echo "Gemma route missing from generated AWS allowlist" >&2
              exit 2
              ;;
          esac
          {
            echo 'models<<EOF'
            printf '%s\n' "$EXPECTED"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Safely update relay allowlist and restart backend
        env:
          EXPECTED_OPENROUTER_MODELS: ${{ steps.expected.outputs.models }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/yorubay-model-sync.sh <<'REMOTE'
          #!/bin/bash
          set -euo pipefail
          ENV_FILE=/etc/bao-backend.env
          SERVICE=bao-backend.service
          EXPECTED='__EXPECTED_OPENROUTER_MODELS__'

          test -f "$ENV_FILE"
          BACKUP="$(mktemp /tmp/bao-backend.env.XXXXXX)"
          cp "$ENV_FILE" "$BACKUP"

          rollback() {
            cp "$BACKUP" "$ENV_FILE" || true
            systemctl daemon-reload || true
            systemctl restart "$SERVICE" || true
          }
          trap rollback ERR

          if grep -q '^OPENROUTER_MODELS=' "$ENV_FILE"; then
            sed -i "s|^OPENROUTER_MODELS=.*$|OPENROUTER_MODELS=$EXPECTED|" "$ENV_FILE"
          else
            printf '\nOPENROUTER_MODELS=%s\n' "$EXPECTED" >> "$ENV_FILE"
          fi

          systemctl daemon-reload
          systemctl restart "$SERVICE"
          sleep 2
          systemctl is-active --quiet "$SERVICE"

          PID="$(systemctl show "$SERVICE" -p MainPID --value)"
          test -n "$PID" && test "$PID" != "0"
          ACTUAL="$(tr '\0' '\n' < "/proc/$PID/environ" | sed -n 's/^OPENROUTER_MODELS=//p')"
          test "$ACTUAL" = "$EXPECTED"

          trap - ERR
          rm -f "$BACKUP"
          printf 'SYNC_OK\n'
          REMOTE

          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('/tmp/yorubay-model-sync.sh')
          text = p.read_text()
          expected = os.environ['EXPECTED_OPENROUTER_MODELS']
          if "'" in expected or "\n" in expected or "\r" in expected:
              raise SystemExit("unexpected characters in model allowlist")
          p.write_text(text.replace('__EXPECTED_OPENROUTER_MODELS__', expected))
          PY

          PAYLOAD="$(base64 -w0 /tmp/yorubay-model-sync.sh)"
          export PAYLOAD
          python3 - <<'PY' > /tmp/ssm-params.json
          import json, os
          payload = os.environ['PAYLOAD']
          command = (
              "set -eu; "
              "printf '%s' '" + payload + "' | base64 -d > /tmp/yorubay-model-sync.sh; "
              "chmod 700 /tmp/yorubay-model-sync.sh; "
              "/tmp/yorubay-model-sync.sh; "
              "rm -f /tmp/yorubay-model-sync.sh"
          )
          print(json.dumps({"commands": [command]}))
          PY

          COMMAND_ID="$(
            aws ssm send-command               --instance-ids i-00a22eb7d55a6ea30               --document-name AWS-RunShellScript               --comment "YoruBay Gemma model allowlist sync"               --parameters file:///tmp/ssm-params.json               --query 'Command.CommandId'               --output text
          )"
          test -n "$COMMAND_ID"

          for attempt in $(seq 1 45); do
            STATUS="$(
              aws ssm get-command-invocation                 --command-id "$COMMAND_ID"                 --instance-id i-00a22eb7d55a6ea30                 --query 'Status'                 --output text 2>/dev/null || true
            )"

            case "$STATUS" in
              Success)
                OUTPUT="$(
                  aws ssm get-command-invocation                     --command-id "$COMMAND_ID"                     --instance-id i-00a22eb7d55a6ea30                     --query 'StandardOutputContent'                     --output text
                )"
                printf '%s\n' "$OUTPUT"
                grep -q '^SYNC_OK$' <<<"$OUTPUT"
                exit 0
                ;;
              Pending|InProgress|Delayed|"")
                sleep 2
                ;;
              *)
                aws ssm get-command-invocation                   --command-id "$COMMAND_ID"                   --instance-id i-00a22eb7d55a6ea30                   --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'                   --output json || true
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for SSM command $COMMAND_ID" >&2
          exit 1

      - name: Re-read live relay configuration and verify Gemma
        shell: bash
        run: |
          set -euo pipefail
          PARAMETERS="$(node scripts/build-aws-relay-config-audit-parameters.cjs)"
          COMMAND_ID="$(
            aws ssm send-command               --instance-ids i-00a22eb7d55a6ea30               --document-name AWS-RunShellScript               --comment "Verify YoruBay Gemma relay allowlist"               --parameters "$PARAMETERS"               --query 'Command.CommandId'               --output text
          )"

          for attempt in $(seq 1 30); do
            STATUS="$(
              aws ssm get-command-invocation                 --command-id "$COMMAND_ID"                 --instance-id i-00a22eb7d55a6ea30                 --query 'Status'                 --output text 2>/dev/null || true
            )"
            case "$STATUS" in
              Success)
                OUTPUT="$(
                  aws ssm get-command-invocation                     --command-id "$COMMAND_ID"                     --instance-id i-00a22eb7d55a6ea30                     --query 'StandardOutputContent'                     --output text
                )"
                ACTUAL="$(
                  printf '%s\n' "$OUTPUT" |
                    sed -n 's/^ACTUAL_OPENROUTER_MODELS=//p' |
                    head -n 1
                )"
                test -n "$ACTUAL"
                OPENROUTER_MODELS="$ACTUAL" npm run audit:aws-models
                exit 0
                ;;
              Pending|InProgress|Delayed|"")
                sleep 2
                ;;
              *)
                exit 1
                ;;
            esac
          done
          exit 1
