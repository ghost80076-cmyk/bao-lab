name: Published privacy policy

on:
  push:
    branches: [main]
    paths:
      - privacy.html
      - index.html
      - CNAME
      - .github/workflows/privacy-policy-check.yml
  workflow_dispatch:

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check committed policy and homepage link
        run: |
          set -euo pipefail
          grep -Fq 'href="privacy.html"' index.html
          grep -Fq '<h1>夜灣隱私權政策</h1>' privacy.html
          grep -Fq 'https://www.googleapis.com/auth/drive.appdata' privacy.html
          grep -Fq 'yorubay.com' CNAME
      - name: Verify the policy and link are live on YoruBay
        run: |
          set -euo pipefail
          root='https://yorubay.com/'
          for attempt in $(seq 1 24); do
            if curl -fsSL --max-time 15 "$root" | grep -Fq 'href="privacy.html"' \
              && curl -fsSL --max-time 15 "${root}privacy.html" | grep -Fq '<h1>夜灣隱私權政策</h1>'; then
              echo 'PASS: YoruBay homepage links to the live privacy policy.'
              exit 0
            fi
            echo "Waiting for YoruBay deployment ($attempt/24) ..."
            sleep 10
          done
          echo 'FAIL: privacy policy or homepage link was not visible on yorubay.com.' >&2
          exit 1
