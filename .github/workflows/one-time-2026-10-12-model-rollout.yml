name: One-time 2026-10-12 model rollout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-2026-10-12-model-rollout.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-model-rollout-2026-10-12
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_OPENROUTER_MODELS: google/gemini-3.8-flash,anthropic/claude-haiku-4.5,anthropic/claude-sonnet-5,anthropic/claude-sonnet-5.5,anthropic/claude-sonnet-4.6,anthropic/claude-sonnet-4.5,anthropic/claude-opus-5.5,anthropic/claude-opus-4.6,deepseek/deepseek-v4-flash-0731,xiaomi/mimo-v2.5,qwen/qwen3.7-flash,minimax/minimax-m3,openai/gpt-5.6-luna,x-ai/grok-4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify model registry contracts
        run: |
          set -euo pipefail
          node tests/model-registry-contract.cjs
          node tests/model-deployment-plan-core.cjs

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::746698923199:role/YoruBayGitHubDeploy
          aws-region: ap-southeast-2
          role-session-name: yorubay-model-rollout-20261012

      - name: Apply AWS relay model allowlist
        id: aws
        shell: bash
        run: |
          set -euo pipefail

          PARAMETERS="$(
            node <<'NODE'
          const expected = process.env.EXPECTED_OPENROUTER_MODELS;
          const commands = [
            "set -eu",
            "UNIT=bao-backend.service",
            "ENV_FILE=/etc/bao-backend.env",
            "BACKUP=/tmp/bao-backend.env.yorubay-models-20261012",
            "test -f \"$ENV_FILE\"",
            "cp \"$ENV_FILE\" \"$BACKUP\"",
            "rollback(){ cp \"$BACKUP\" \"$ENV_FILE\"; systemctl restart \"$UNIT\" || true; }",
            "trap rollback ERR",
            `EXPECTED='${expected}'`,
            "if grep -q '^OPENROUTER_MODELS=' \"$ENV_FILE\"; then sed -i \"s#^OPENROUTER_MODELS=.*#OPENROUTER_MODELS=$EXPECTED#\" \"$ENV_FILE\"; else printf '\\nOPENROUTER_MODELS=%s\\n' \"$EXPECTED\" >> \"$ENV_FILE\"; fi",
            "systemctl restart \"$UNIT\"",
            "systemctl is-active --quiet \"$UNIT\"",
            "PID=\"$(systemctl show \"$UNIT\" -p MainPID --value)\"",
            "test -n \"$PID\" && test \"$PID\" != \"0\"",
            "ACTUAL=\"$(tr '\\0' '\\n' < \"/proc/$PID/environ\" | sed -n 's/^OPENROUTER_MODELS=//p')\"",
            "test \"$ACTUAL\" = \"$EXPECTED\"",
            "printf 'ACTUAL_OPENROUTER_MODELS=%s\\n' \"$ACTUAL\"",
            "trap - ERR",
            "rm -f \"$BACKUP\""
          ];
          process.stdout.write(JSON.stringify({ commands }));
          NODE
          )"

          COMMAND_ID="$(
            aws ssm send-command               --instance-ids i-00a22eb7d55a6ea30               --document-name AWS-RunShellScript               --comment "YoruBay 2026-10-12 model allowlist rollout"               --parameters "$PARAMETERS"               --query 'Command.CommandId'               --output text
          )"
          test -n "$COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS="$(
              aws ssm get-command-invocation                 --command-id "$COMMAND_ID"                 --instance-id i-00a22eb7d55a6ea30                 --query 'Status'                 --output text 2>/dev/null || true
            )"

            case "$STATUS" in
              Success)
                OUTPUT="$(
                  aws ssm get-command-invocation                     --command-id "$COMMAND_ID"                     --instance-id i-00a22eb7d55a6ea30                     --query 'StandardOutputContent'                     --output text
                )"
                printf '%s\n' "$OUTPUT"
                ACTUAL="$(printf '%s\n' "$OUTPUT" | sed -n 's/^ACTUAL_OPENROUTER_MODELS=//p' | tail -n 1)"
                test -n "$ACTUAL"
                {
                  echo 'openrouter_models<<EOF'
                  printf '%s\n' "$ACTUAL"
                  echo 'EOF'
                } >> "$GITHUB_OUTPUT"
                break
                ;;
              Pending|InProgress|Delayed|"")
                sleep 2
                ;;
              *)
                aws ssm get-command-invocation                   --command-id "$COMMAND_ID"                   --instance-id i-00a22eb7d55a6ea30                   --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'                   --output json || true
                exit 1
                ;;
            esac

            if [ "$attempt" -eq 30 ]; then
              echo "Timed out waiting for SSM command $COMMAND_ID" >&2
              exit 1
            fi
          done

      - name: Audit AWS relay model allowlist
        env:
          OPENROUTER_MODELS: ${{ steps.aws.outputs.openrouter_models }}
        run: npm run audit:aws-models

      - name: Apply Cloudflare model bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          YORUBAY_MODEL_BINDINGS_APPLY: APPLY_REGISTRY_MODEL_BINDINGS
        run: node scripts/apply-production-model-registry.cjs

      - name: Verify Cloudflare production model registry
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
        run: node scripts/audit-production-model-registry.cjs
