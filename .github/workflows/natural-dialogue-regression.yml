name: Natural dialogue regression

on:
  pull_request:
    paths:
      - 'js/prompt-orchestrator.js'
      - 'js/player-settings.js'
      - 'js/site-i18n.js'
      - 'css/site-i18n.css'
      - 'index.html'
      - 'account.html'
      - 'author.html'
      - 'quick-start.html'
      - 'tests/site-i18n-core.cjs'
      - 'data/prompts/*.json'
      - 'data/characters/community/c4/kept-in-frame-lin-youzhen.json'
      - 'tests/natural-dialogue-voice-regression.test.cjs'
      - 'tests/prompt-orchestrator-core.cjs'
      - 'tests/response-language-core.cjs'
      - 'tests/kept-in-frame-relationship-startup.test.cjs'
      - '.github/workflows/natural-dialogue-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dialogue-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and targeted regressions
        run: |
          node --check js/prompt-orchestrator.js
          node --check js/site-i18n.js
          node --check js/player-settings.js
          node --check tests/natural-dialogue-voice-regression.test.cjs
          node tests/natural-dialogue-voice-regression.test.cjs
          node tests/kept-in-frame-relationship-startup.test.cjs
          node tests/prompt-orchestrator-core.cjs
          node tests/response-language-core.cjs
          node tests/site-i18n-core.cjs
          node tests/narrative-prompt-pipeline-core.cjs
          node tests/prompt-cache-core.cjs
          node tests/platform-character-prompt-dedup.test.cjs
          node tests/all-community-card-prompt-boundaries.test.cjs
          node tests/opening-context-regression.test.cjs
