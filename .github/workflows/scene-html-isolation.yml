name: Scene HTML isolation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scene startup and author template isolation
        run: node tests/scene-html-request-isolation.cjs
      - name: Check smart memory request isolation
        run: node tests/scene-html-memory-isolation.cjs
      - name: Check seven scene templates, escaping and plain-text fallback
        run: node tests/scene-template-core.cjs
