name: AWS relay model registry audit

on:
  push:
    branches: [main]
    paths:
      - data/presets/models.json
      - scripts/audit-aws-openrouter-models.cjs
      - scripts/build-aws-relay-config-audit-parameters.cjs
      - .github/workflows/aws-relay-model-registry-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-relay-model-registry-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::746698923199:role/YoruBayGitHubDeploy
          aws-region: ap-southeast-2
          role-session-name: yorubay-aws-relay-model-audit

      - name: Read relay model configuration through SSM
        id: relay
        shell: bash
        run: |
          set -euo pipefail

          PARAMETERS="$(node scripts/build-aws-relay-config-audit-parameters.cjs)"
          COMMAND_ID="$(
            aws ssm send-command               --instance-ids i-00a22eb7d55a6ea30               --document-name AWS-RunShellScript               --comment "YoruBay relay model registry audit"               --parameters "$PARAMETERS"               --query 'Command.CommandId'               --output text
          )"

          test -n "$COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS="$(
              aws ssm get-command-invocation                 --command-id "$COMMAND_ID"                 --instance-id i-00a22eb7d55a6ea30                 --query 'Status'                 --output text 2>/dev/null || true
            )"

            case "$STATUS" in
              Success)
                OUTPUT="$(
                  aws ssm get-command-invocation                     --command-id "$COMMAND_ID"                     --instance-id i-00a22eb7d55a6ea30                     --query 'StandardOutputContent'                     --output text
                )"
                printf '%s\n' "$OUTPUT"

                ACTUAL="$(
                  printf '%s\n' "$OUTPUT" |
                    sed -n 's/^ACTUAL_OPENROUTER_MODELS=//p' |
                    head -n 1
                )"

                if [ -z "$ACTUAL" ]; then
                  echo "OPENROUTER_MODELS was not found in the running bao-backend process." >&2
                  exit 1
                fi

                {
                  echo 'openrouter_models<<EOF'
                  printf '%s\n' "$ACTUAL"
                  echo 'EOF'
                } >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              Pending|InProgress|Delayed|"")
                sleep 2
                ;;
              *)
                aws ssm get-command-invocation                   --command-id "$COMMAND_ID"                   --instance-id i-00a22eb7d55a6ea30                   --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'                   --output json || true
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for SSM command $COMMAND_ID" >&2
          exit 1

      - name: Compare live relay allowlist with registry
        env:
          OPENROUTER_MODELS: ${{ steps.relay.outputs.openrouter_models }}
        run: npm run audit:aws-models
