name: Regex library tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regex-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Local regex import and safety tests
        run: node --test tests/regex-library.test.cjs
      - name: Author Regex MOD core tests
        run: node --test tests/author-regex-mod-core.test.cjs
      - name: Check chat adapter and Regex MOD JavaScript syntax
        run: |
          node --check js/regex-library.js
          node --check js/regex-chat.js
          node --check js/author-regex-core.js
          node --check js/author-regex-compat.js
          node --check js/author-regex-studio.js
          node --check js/author-regex-inline.js
          node --check js/author-regex-dock.js
