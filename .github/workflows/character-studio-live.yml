name: Character studio live verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/character-studio-live.yml
      - scripts/verify-live-assets.sh
      - tests/live-assets-verifier.test.cjs
      - character-studio.html
      - js/character-library-repair.js
      - js/global-bridge.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify published studio and recovery scripts
        shell: bash
        env:
          SITE_URL: https://ghost80076-cmyk.github.io/bao-lab/
          LIVE_VERIFY_ATTEMPTS: '40'
          LIVE_VERIFY_TIMEOUT: '12'
        run: bash scripts/verify-live-assets.sh character-studio.html js/character-library-repair.js js/global-bridge.js
