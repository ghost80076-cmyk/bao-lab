name: Credits Worker pilot checks
on:
  pull_request:
    paths:
      - 'credits-worker/**'
      - '.github/workflows/credits-worker-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check credits-worker/src/index.js
      - name: Unit tests
        run: node --test credits-worker/tests/*.test.mjs
