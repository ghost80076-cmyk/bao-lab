name: Author regex live Pages interaction
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/regex-chat.js'
      - 'js/author-regex-core.js'
      - 'js/author-regex-card-bind.js'
      - 'js/author-regex-compat.js'
      - 'js/author-regex-inline.js'
      - 'js/author-regex-dock.js'
      - 'tests/e2e/author-regex-*.spec.cjs'
      - '.github/workflows/author-regex-live.yml'
      - 'scripts/verify-live-assets.sh'
      - 'tests/live-assets-verifier.test.cjs'
      - '.github/actions/setup-chromium/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-author-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-chromium
      - name: Wait until the public site serves this revision
        shell: bash
        env:
          SITE_URL: ${{ env.BAO_LIVE_URL }}
          LIVE_VERIFY_ATTEMPTS: '60'
          LIVE_VERIFY_QUERY: ci
        run: >-
          bash scripts/verify-live-assets.sh
          js/author-regex-dock.js js/author-regex-core.js index.html
          js/author-regex-inline.js js/regex-chat.js
      - name: Exercise real Pages in Chromium without an API key
        run: npx playwright test tests/e2e/author-regex-inline.spec.cjs tests/e2e/author-regex-dock.spec.cjs tests/e2e/author-regex-legacy-input.spec.cjs tests/e2e/author-regex-ui-save.spec.cjs --project=chromium
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: author-regex-live-failure
          path: test-results/
          if-no-files-found: ignore
