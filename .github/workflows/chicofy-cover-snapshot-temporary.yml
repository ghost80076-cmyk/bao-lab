name: Snapshot Chicofy author-provided cover (temporary)
on:
  push:
    branches: [fix/chicofy-opening-rotation-portrait-20261031]
    paths: [.github/workflows/chicofy-cover-snapshot-temporary.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified author-provided cover and optimize
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import urllib.request,pathlib,struct
          from PIL import Image,ImageOps
          source='https://i.meee.com.tw/BORVsUi.png'
          out=pathlib.Path('assets/characters/chicofy-six-timelines')
          out.mkdir(parents=True,exist_ok=True)
          request=urllib.request.Request(source,headers={'User-Agent':'Mozilla/5.0 (YoruBay artwork preservation)'})
          with urllib.request.urlopen(request,timeout=30) as response:
              raw=response.read(15000000)
              print('HTTP',response.status,'type',response.headers.get('Content-Type'),'bytes',len(raw))
          if not raw.startswith(b'\x89PNG\r\n\x1a\n') or not 128<=len(raw)<=14000000:
              raise ValueError('Original author cover is not a valid PNG')
          width,height=struct.unpack('>II',raw[16:24])
          if width<100 or height<100 or width>12000 or height>12000:
              raise ValueError('Invalid original dimensions')
          (out/'cover.png').write_bytes(raw)
          with Image.open(out/'cover.png') as img:
              img=ImageOps.exif_transpose(img)
              img.thumbnail((960,1280),Image.Resampling.LANCZOS)
              converted=img.convert('RGBA' if img.has_transparency_data else 'RGB')
              converted.save(out/'cover.webp','WEBP',quality=82,method=6)
          print('Cover WebP', (out/'cover.webp').stat().st_size)
          PY
      - name: Store original cover and lightweight optimized copy
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add assets/characters/chicofy-six-timelines/cover.png assets/characters/chicofy-six-timelines/cover.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets(chicofy): preserve supplied work cover locally'
            git push origin HEAD:fix/chicofy-opening-rotation-portrait-20261031
          fi
