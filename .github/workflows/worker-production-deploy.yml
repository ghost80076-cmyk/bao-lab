name: Deploy production Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/worker-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: production-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployment boundary
        run: |
          node --check workers/bao-lab-credits-api/worker.js
          node tests/worker-content-deploy-core.cjs
          node tests/worker-security-headers-core.cjs
          node tests/worker-session-security-contract.cjs
          node tests/worker-account-rate-limit-core.cjs
          node tests/worker-account-auth-core.cjs
          node tests/worker-provider-transport-core.cjs
      - name: Resolve target and replace production Worker content
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { deployWorkerContent } = require("./scripts/deploy-worker-content.cjs");
          (async () => {
            const token = String(process.env.CLOUDFLARE_API_TOKEN || "").trim();
            if (!token) throw new Error("CLOUDFLARE_API_TOKEN is required");
            const response = await fetch("https://api.cloudflare.com/client/v4/accounts?per_page=50", {
              headers: { authorization: `Bearer ${token}`, accept: "application/json" }
            });
            const payload = await response.json().catch(() => null);
            const accounts = Array.isArray(payload?.result) ? payload.result : [];
            if (!response.ok || payload?.success === false) {
              throw new Error(`Cloudflare account discovery failed (HTTP ${response.status})`);
            }
            if (accounts.length !== 1 || !/^[a-f0-9]{32}$/i.test(String(accounts[0]?.id || ""))) {
              throw new Error(`Cloudflare account discovery expected exactly one accessible account (found ${accounts.length})`);
            }
            const source = fs.readFileSync("workers/bao-lab-credits-api/worker.js", "utf8");
            const result = await deployWorkerContent({
              accountId: accounts[0].id,
              apiToken: token,
              workerName: "yorubay-credits-pilot",
              source
            });
            console.log(`Cloudflare Worker content deployed successfully (HTTP ${result.status})`);
          })().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
      - name: Verify production security contract
        run: npm run audit:production-security
