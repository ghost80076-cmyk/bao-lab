name: One-time Claude cache relay deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-claude-cache-relay-deploy.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: claude-cache-relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::746698923199:role/YoruBayGitHubDeploy
          aws-region: ap-southeast-2
          role-session-name: yorubay-claude-cache-relay

      - name: Patch and restart relay
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          PARAMETERS="$(
            node <<'NODE'
          const script = String.raw`set -eu
          cd /opt/bao-backend
          BACKUP=/tmp/app.py.before-claude-cache-1h
          cp app.py "$BACKUP"
          rollback() {
            cp "$BACKUP" app.py
            python3 -m py_compile app.py || true
            systemctl restart bao-backend.service || true
          }
          trap rollback ERR
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app.py")
          s = p.read_text()
          old = '''    if (
                  not isinstance(text, str)
                  or not text
                  or len(text) > 80_000
                  or not isinstance(cache_control, dict)
                  or set(cache_control.keys()) != {"type"}
                  or cache_control.get("type") != "ephemeral"
              ):
                  return False
          '''
          new = '''    if (
                  not isinstance(text, str)
                  or not text
                  or len(text) > 80_000
                  or not isinstance(cache_control, dict)
                  or set(cache_control.keys()) not in (
                      {"type"},
                      {"type", "ttl"},
                  )
                  or cache_control.get("type") != "ephemeral"
                  or (
                      "ttl" in cache_control
                      and cache_control.get("ttl") not in {"5m", "1h"}
                  )
              ):
                  return False
          '''
          if new in s:
              print("relay validator already supports cache TTL")
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print("relay validator patched")
          else:
              raise SystemExit("relay validator block not found")
          PY
          python3 -m py_compile app.py
          grep -q '"ttl" in cache_control' app.py
          systemctl restart bao-backend.service
          systemctl is-active --quiet bao-backend.service
          sleep 1
          curl -fsS http://127.0.0.1:8080/health >/tmp/yorubay-health.json
          python3 -c 'import json; d=json.load(open("/tmp/yorubay-health.json")); assert d.get("ok") is True'
          trap - ERR
          rm -f "$BACKUP" /tmp/yorubay-health.json
          echo YORUBAY_CLAUDE_CACHE_RELAY_OK`;

          process.stdout.write(JSON.stringify({ commands: [script] }));
          NODE
          )"

          COMMAND_ID="$(
            aws ssm send-command               --instance-ids i-00a22eb7d55a6ea30               --document-name AWS-RunShellScript               --comment "YoruBay Claude cache 1h relay deploy"               --parameters "$PARAMETERS"               --query 'Command.CommandId'               --output text
          )"
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for relay deployment
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            STATUS="$(
              aws ssm get-command-invocation                 --command-id "$COMMAND_ID"                 --instance-id i-00a22eb7d55a6ea30                 --query 'Status'                 --output text 2>/dev/null || true
            )"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation                   --command-id "$COMMAND_ID"                   --instance-id i-00a22eb7d55a6ea30                   --query '{Status:Status,Output:StandardOutputContent}'                   --output json
                exit 0
                ;;
              Pending|InProgress|Delayed|"")
                sleep 2
                ;;
              *)
                aws ssm get-command-invocation                   --command-id "$COMMAND_ID"                   --instance-id i-00a22eb7d55a6ea30                   --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'                   --output json || true
                exit 1
                ;;
            esac
          done
          echo "Timed out waiting for relay deployment" >&2
          exit 1
