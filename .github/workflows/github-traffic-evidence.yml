name: GitHub Traffic Evidence

on:
  # GitHub Traffic uses UTC days. Collect after the preceding UTC day closes.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/github-traffic-evidence.yml'
      - 'scripts/github_traffic_evidence.py'
      - 'tests/test_github_traffic_evidence.py'

# Never expose the traffic-read token to PR code.
concurrency:
  group: github-traffic-evidence-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Traffic snapshot unit tests
        run: python -m unittest discover -s tests -p 'test_github_traffic_evidence.py' -v

  capture:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate snapshot logic
        run: python -m unittest discover -s tests -p 'test_github_traffic_evidence.py' -v
      - name: Capture rolling 14-day traffic and action counts
        env:
          GH_TRAFFIC_TOKEN: \${{ secrets.TRAFFIC_READ_TOKEN }}
          GITHUB_TOKEN: \${{ github.token }}
          GH_ARCHIVE_REPO: \${{ vars.TRAFFIC_ARCHIVE_REPO }}
          GH_ARCHIVE_TOKEN: \${{ secrets.TRAFFIC_ARCHIVE_TOKEN }}
        run: python scripts/github_traffic_evidence.py
      - name: Preserve raw snapshot as a private Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-evidence-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: traffic-evidence-output/
          retention-days: 90
          if-no-files-found: ignore
