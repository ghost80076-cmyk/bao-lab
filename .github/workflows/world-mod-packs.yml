name: World MOD packs

on:
  push:
    branches: [main]
    paths:
      - 'js/world-mod-packs.js'
      - 'js/world-relevance.js'
      - 'tests/world-mod-packs-core.cjs'
      - 'tests/e2e/world-mod-packs.spec.cjs'
      - 'tests/e2e/world-mod-packs-mobile.spec.cjs'
      - '.github/workflows/world-mod-packs.yml'
      - 'scripts/verify-live-assets.sh'
      - 'tests/live-assets-verifier.test.cjs'
  pull_request:
    branches: [main]
    paths:
      - 'js/world-mod-packs.js'
      - 'js/world-relevance.js'
      - 'tests/world-mod-packs-core.cjs'
      - 'tests/e2e/world-mod-packs.spec.cjs'
      - 'tests/e2e/world-mod-packs-mobile.spec.cjs'
      - '.github/workflows/world-mod-packs.yml'
      - 'scripts/verify-live-assets.sh'
      - 'tests/live-assets-verifier.test.cjs'

permissions:
  contents: read

jobs:
  mod-pack-core-and-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node tests/world-mod-packs-core.cjs
      - run: npm ci
      - run: npx playwright test tests/e2e/world-mod-packs.spec.cjs tests/e2e/world-mod-packs-mobile.spec.cjs --project=chromium --project=firefox --project=webkit
      - name: Verify the published MOD script matches this commit
        if: github.event_name == 'push'
        shell: bash
        env:
          SITE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: bash scripts/verify-live-assets.sh js/world-mod-packs.js
