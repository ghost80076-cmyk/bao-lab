name: World MOD packs

on:
  push:
    branches: [main]
    paths:
      - 'js/world-mod-packs.js'
      - 'js/world-relevance.js'
      - 'tests/world-mod-packs-core.cjs'
      - 'tests/e2e/world-mod-packs.spec.cjs'
      - 'tests/e2e/world-mod-packs-mobile.spec.cjs'
      - '.github/workflows/world-mod-packs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'js/world-mod-packs.js'
      - 'js/world-relevance.js'
      - 'tests/world-mod-packs-core.cjs'
      - 'tests/e2e/world-mod-packs.spec.cjs'
      - 'tests/e2e/world-mod-packs-mobile.spec.cjs'
      - '.github/workflows/world-mod-packs.yml'

permissions:
  contents: read

jobs:
  mod-pack-core-and-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node tests/world-mod-packs-core.cjs
      - run: npm ci
      - run: npx playwright test tests/e2e/world-mod-packs.spec.cjs tests/e2e/world-mod-packs-mobile.spec.cjs --project=chromium --project=firefox --project=webkit
      - name: Verify the published MOD script matches this commit
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          url="https://ghost80076-cmyk.github.io/bao-lab/js/world-mod-packs.js"
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location --max-time 15 \
              "${url}?commit=${GITHUB_SHA}" -o /tmp/bao-world-mod-packs-live.js \
              && cmp -s js/world-mod-packs.js /tmp/bao-world-mod-packs-live.js; then
              printf 'Published MOD script matches the checked-out source on attempt %s.\n' "${attempt}"
              exit 0
            fi
            printf 'Waiting for matching MOD script on Pages (attempt %s/36)...\n' "${attempt}"
            sleep 5
          done
          printf 'Published MOD script did not match the checked-out source.\n' >&2
          exit 1
