name: Fast Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-core:
    name: Fast E2E · Chromium core · ${{ matrix.group }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: mobile-reading
            specs: |
              tests/e2e/mobile-tools-compact.spec.cjs
              tests/e2e/mobile-composer-tools.spec.cjs
              tests/e2e/mobile-reading-layout.spec.cjs
              tests/e2e/story-quick-commands.spec.cjs
              tests/e2e/mobile-story-entry.spec.cjs
              tests/e2e/story-integrity.spec.cjs
              tests/e2e/world-module-manager-mobile.spec.cjs
          - group: product-explore
            specs: |
              tests/e2e/builder-connection-ux.spec.cjs
              tests/e2e/character-studio-actions.spec.cjs
              tests/e2e/character-studio-flow.spec.cjs
              tests/e2e/character-studio-lifecycle.spec.cjs
              tests/e2e/explore-discovery.spec.cjs
              tests/e2e/adult-content-visibility.spec.cjs
              tests/e2e/portable-story-actors.spec.cjs
              tests/e2e/author-profile.spec.cjs
              tests/e2e/reading-bookshelf.spec.cjs
              tests/e2e/scene-image-moments.spec.cjs
              tests/e2e/gameplay-ui-engine.spec.cjs
          - group: cards-simulators
            specs: |
              tests/e2e/player-shell-v2.spec.cjs
              tests/e2e/player-feedback-ux.spec.cjs
              tests/e2e/kept-in-frame.spec.cjs
              tests/e2e/linchenfeng-structured-opening.spec.cjs
              tests/e2e/host-club-simulator.spec.cjs
              tests/e2e/night-sky-magic-academy.spec.cjs
              tests/e2e/k-idol-survival-simulator.spec.cjs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Run Chromium E2E group
        shell: bash
        env:
          SPEC_LIST: ${{ matrix.specs }}
        run: |
          specs=()
          while IFS= read -r spec; do
            [ -z "$spec" ] && continue
            if [ -f "$spec" ]; then
              specs+=("$spec")
            fi
          done <<< "$SPEC_LIST"

          if [ "${#specs[@]}" -eq 0 ]; then
            echo "No matching specs in group ${{ matrix.group }}; skipping."
            exit 0
          fi

          npm run test:e2e -- "${specs[@]}" --project=chromium
      - name: Upload Chromium report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-playwright-report-chromium-${{ matrix.group }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  onboarding:
    name: Onboarding · Chromium
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Verify quick-start onboarding
        run: >-
          npm run test:e2e --
          tests/e2e/quick-start.spec.cjs
          tests/e2e/account-author-identity.spec.cjs
          --project=chromium
      - name: Upload onboarding report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  story-controls:
    name: Story controls · Chromium
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Verify story controls and portable extension packs
        run: >-
          npm run test:e2e --
          tests/e2e/story-control-center.spec.cjs
          tests/e2e/story-import-routing.spec.cjs
          tests/e2e/story-status-opening-compat.spec.cjs
          tests/e2e/story-extension-pack.spec.cjs
          tests/e2e/commentary-mods.spec.cjs
          tests/e2e/interpretation-mods.spec.cjs
          tests/e2e/reader-context-desktop.spec.cjs
          tests/e2e/chat-api-settings.spec.cjs
          --project=chromium
      - name: Upload story control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-control-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  cross-browser-smoke:
    name: Smoke · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Run cross-browser smoke flows
        run: >-
          npm run test:e2e --
          tests/e2e/mobile-story-entry.spec.cjs
          tests/e2e/story-integrity.spec.cjs
          --project=${{ matrix.browser }}
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  pages-smoke:
    name: Live Pages smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 4
    needs: chromium-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Verify deployed Pages content
        run: node tests/pages-content-check.cjs
      - name: Verify live Pages brand shell
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/community-brand.spec.cjs --project=chromium
      - name: Verify live Kept in Frame desktop and mobile
        env:
          BAO_LIVE_URL: https://yorubay.com/
        run: npm run test:e2e -- tests/e2e/kept-in-frame.spec.cjs --project=chromium
