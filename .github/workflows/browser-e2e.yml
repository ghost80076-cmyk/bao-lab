name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cross-browser:
    name: E2E · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run desktop and mobile E2E on ${{ matrix.browser }}
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - name: Verify deployed Pages content
        if: github.event_name == 'push' && matrix.browser == 'chromium'
        run: node tests/pages-content-check.cjs
      - name: Verify live Pages memory flow
        if: github.event_name == 'push' && matrix.browser == 'chromium'
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/memory-preferences.spec.cjs --project=chromium
      - name: Upload browser verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

