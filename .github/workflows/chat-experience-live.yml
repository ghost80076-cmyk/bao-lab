name: Chat experience deploy verification

on:
  push:
    branches: [main]
    paths:
      - 'js/chat-presentation-core.js'
      - 'js/chat-experience.js'
      - 'js/chat-shell-fix.js'
      - 'js/world-module-manager.js'
      - 'js/character-status-ui.js'
      - 'js/player-settings.js'
      - 'css/chat-experience.css'
      - 'tests/chat-presentation-core.cjs'
      - '.github/workflows/chat-experience-live.yml'
      - 'scripts/verify-live-assets.sh'
      - 'tests/live-assets-verifier.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-chat-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout current code
        uses: actions/checkout@v4
      - name: Test status parser and JavaScript syntax
        run: |
          node --check js/chat-presentation-core.js
          node --check js/chat-experience.js
          node --check js/chat-shell-fix.js
          node --check js/world-module-manager.js
          node --check js/character-status-ui.js
          node --check js/player-settings.js
          node tests/chat-presentation-core.cjs
      - name: Verify chat assets are on live Pages
        shell: bash
        env:
          SITE_URL: https://ghost80076-cmyk.github.io/bao-lab/
          LIVE_VERIFY_ATTEMPTS: '48'
          LIVE_VERIFY_TIMEOUT: '12'
          LIVE_VERIFY_QUERY: sha
        run: >-
          bash scripts/verify-live-assets.sh
          js/chat-shell-fix.js js/chat-presentation-core.js js/chat-experience.js
          css/chat-experience.css js/world-module-manager.js js/character-status-ui.js js/player-settings.js
