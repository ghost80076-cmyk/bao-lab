name: BAO mascot live smoke

on:
  push:
    branches: [main]
    paths:
      - 'bao-mascot.html'
      - 'bao-room/**'
      - 'js/bao-character.js'
      - 'css/bao-character.css'
      - 'js/brand-ui.js'
      - 'js/site-ui.js'
      - 'index.html'
      - 'assets/bao-human-v2.webp'
      - 'js/bao-mascot.js'
      - 'js/bao-image-quality.js'
      - 'js/bao-visual-ui.js'
      - 'css/bao-mascot.css'
      - 'css/bao-image-quality.css'
      - '.github/workflows/bao-mascot-live.yml'
      - 'scripts/verify-live-assets.sh'
      - 'tests/live-assets-verifier.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mascot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE: https://ghost80076-cmyk.github.io/bao-lab/
    steps:
      - uses: actions/checkout@v4
      - name: Verify mascot page, animation guards and portrait format
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'bao-native-stage' bao-mascot.html
          grep -Fq 'js/bao-character.js' bao-mascot.html
          grep -Fq 'bao-room/assets/human.png' css/bao-character.css
          grep -Fq 'id="bao-page-open"' bao-mascot.html
          grep -Fq 'js/bao-mascot.js' bao-mascot.html
          grep -Fq 'js/bao-image-quality.js' bao-mascot.html
          grep -Fq 'css/bao-image-quality.css' bao-mascot.html
          grep -Fq 'bao-mascot-transform' js/bao-mascot.js
          grep -Fq 'bao-mascot-motion' js/bao-mascot.js
          grep -Fq 'BAOCharacter.set' js/bao-mascot.js
          grep -Fq '@keyframes bao-bun-blink' css/bao-mascot.css
          grep -Fq 'prefers-reduced-motion:reduce' css/bao-mascot.css
          grep -Fq 'bao-image-lowres' js/bao-image-quality.js
          grep -Fq 'bao-portrait-bun' css/bao-image-quality.css
          grep -Fq 'js/bao-image-quality.js' js/bao-visual-ui.js
          node --check js/bao-character.js
          node --check js/bao-mascot.js
          node --check js/bao-image-quality.js
          node --check js/bao-visual-ui.js
          python3 - <<'PYTHON'
          from pathlib import Path
          blob = Path('assets/bao-human-v2.webp').read_bytes()
          assert len(blob) > 1000, 'Portrait is empty'
          assert blob[:4] == b'RIFF' and blob[8:12] == b'WEBP', 'Portrait is not a WebP'
          if blob[12:16] == b'VP8X':
              w = int.from_bytes(blob[24:27], 'little') + 1
              h = int.from_bytes(blob[27:30], 'little') + 1
              print(f'Human portrait canvas: {w}x{h}; size {len(blob)} bytes')
          PYTHON

      - name: Verify all mascot assets match this commit on Pages
        shell: bash
        env:
          SITE_URL: ${{ env.SITE }}
          LIVE_VERIFY_ATTEMPTS: '60'
        run: >-
          bash scripts/verify-live-assets.sh
          bao-mascot.html index.html js/brand-ui.js js/site-ui.js
          js/bao-character.js css/bao-character.css
          bao-room/index.html bao-room/style.css bao-room/app.js
          bao-room/assets/bun.png bao-room/assets/human.png
          js/bao-mascot.js css/bao-mascot.css
          js/bao-image-quality.js css/bao-image-quality.css js/bao-visual-ui.js
