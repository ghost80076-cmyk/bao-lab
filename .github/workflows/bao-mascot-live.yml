name: BAO mascot live smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mascot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE: https://ghost80076-cmyk.github.io/bao-lab/
    steps:
      - name: Wait for updated live mascot page
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 60); do
            html="$(curl -fsSL --max-time 15 "${SITE}bao-mascot.html" || true)"
            if grep -Fq 'assets/bao-human-v2.webp' <<<"${html}" \
              && grep -Fq 'id="bao-page-open"' <<<"${html}" \
              && grep -Fq 'js/bao-mascot.js?v=3' <<<"${html}" \
              && grep -Fq 'js/bao-image-quality.js?v=1' <<<"${html}" \
              && grep -Fq 'css/bao-image-quality.css?v=1' <<<"${html}"; then
              ok=1
              printf 'Live BAO page updated on attempt %s.\n' "${attempt}"
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

      - name: Verify interactive SVG, CSS and human preview
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "${SITE}assets/bao-human-v2.webp" -o /tmp/bao-human-v2.webp
          python3 - <<'PY'
          from pathlib import Path
          blob = Path('/tmp/bao-human-v2.webp').read_bytes()
          assert len(blob) > 1000, 'Portrait is empty'
          assert blob[:4] == b'RIFF' and blob[8:12] == b'WEBP', 'Portrait is not a WebP'
          if blob[12:16] == b'VP8X':
              w = int.from_bytes(blob[24:27], 'little') + 1
              h = int.from_bytes(blob[27:30], 'little') + 1
              print(f'Human portrait canvas: {w}x{h}; size {len(blob)} bytes')
          PY
          curl -fsSL --max-time 20 "${SITE}js/bao-mascot.js?v=3" -o /tmp/bao-mascot.js
          curl -fsSL --max-time 20 "${SITE}css/bao-mascot.css?v=3" -o /tmp/bao-mascot.css
          curl -fsSL --max-time 20 "${SITE}js/bao-image-quality.js?v=1" -o /tmp/bao-image-quality.js
          curl -fsSL --max-time 20 "${SITE}css/bao-image-quality.css?v=1" -o /tmp/bao-image-quality.css
          curl -fsSL --max-time 20 "${SITE}js/bao-visual-ui.js" -o /tmp/bao-visual-ui.js
          grep -Fq 'bao-mascot-transform' /tmp/bao-mascot.js
          grep -Fq 'bao-mascot-motion' /tmp/bao-mascot.js
          grep -Fq 'bao-bun-eyes' /tmp/bao-mascot.js
          grep -Fq '@keyframes bao-bun-blink' /tmp/bao-mascot.css
          grep -Fq 'prefers-reduced-motion:reduce' /tmp/bao-mascot.css
          grep -Fq 'bao-image-lowres' /tmp/bao-image-quality.js
          grep -Fq 'bao-portrait-bun' /tmp/bao-image-quality.css
          grep -Fq 'js/bao-image-quality.js?v=1' /tmp/bao-visual-ui.js
          node --check /tmp/bao-mascot.js
          node --check /tmp/bao-image-quality.js
          node --check /tmp/bao-visual-ui.js
          printf 'Live BAO mascot animation and resolution guard verified.\n'
