name: Voice P2 real WASM research smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/voice-p2-*.cjs'
      - '.github/workflows/voice-p2-research.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-p2-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare fixed candidate assets (research runner only)
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/voice-p2"
          model="$root/models/whisper-tiny"
          mkdir -p "$model/onnx" "$root/runtime"
          revision=ff4177021cc41f7db950912b73ea4fdf7d01d8e7
          for file in config.json generation_config.json preprocessor_config.json tokenizer.json tokenizer_config.json special_tokens_map.json added_tokens.json normalizer.json vocab.json merges.txt onnx/encoder_model_quantized.onnx onnx/decoder_model_merged_quantized.onnx; do
            curl --fail --silent --show-error --location --retry 2 --max-time 180 --proto '=https' "https://huggingface.co/onnx-community/whisper-tiny/resolve/$revision/$file" -o "$model/$file"
          done
          node scripts/voice-p2-verify-weights.cjs "$model"
          npm pack @huggingface/transformers@3.8.1 --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/huggingface-transformers-3.8.1.tgz" -C "$root/runtime" --strip-components=2 package/dist/transformers.web.min.js package/dist/ort-wasm-simd-threaded.jsep.mjs package/dist/ort-wasm-simd-threaded.jsep.wasm
          find "$root" -type f -print0 | sort -z | xargs -0 sha256sum | tee "$RUNNER_TEMP/voice-p2-observed-sha256.txt"
          du -sh "$root"
      - name: Prepare synthetic audio and Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg
          espeak-ng -v en-us -s 145 -w "$RUNNER_TEMP/voice-p2-source.wav" "Hello world. This is a local voice test."
          ffmpeg -v error -i "$RUNNER_TEMP/voice-p2-source.wav" -ac 1 -ar 16000 -c:a pcm_s16le "$RUNNER_TEMP/voice-p2-test.wav"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Real local browser inference, cancellation, no external HTTP
        run: |
          node scripts/voice-p2-browser-lab.cjs "$RUNNER_TEMP/voice-p2" > "$RUNNER_TEMP/voice-p2-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat "$RUNNER_TEMP/voice-p2-server.log"' EXIT
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/ >/dev/null
          node <<'NODE'
          const {chromium}=require('@playwright/test');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const external=[], failed=[];
            try {
              const ctx=await browser.newContext({serviceWorkers:'block'});
              await ctx.route('**/*',r=>{
                if(new URL(r.request().url()).origin==='http://127.0.0.1:8787')return r.continue();
                external.push(r.request().url());return r.abort();
              });
              const page=await ctx.newPage();
              page.on('requestfailed',r=>failed.push(r.url()));
              page.on('console',m=>{if(m.type()==='error')console.log('browser:',m.text());});
              await page.goto('http://127.0.0.1:8787/');
              await page.locator('#audio').setInputFiles(process.env.RUNNER_TEMP+'/voice-p2-test.wav');
              await page.locator('#language').selectOption('english');
              await page.locator('#start').click();
              await page.locator('#stop').click();
              assert.match(await page.locator('#status').innerText(),/Cancelled/);
              await page.locator('#start').click();
              await page.waitForFunction(()=>!document.getElementById('start').disabled,null,{timeout:310000});
              const status=await page.locator('#status').innerText();
              const output=await page.locator('#output').innerText();
              console.log(JSON.stringify({status,output,external,failed},null,2));
              assert.match(status,/Complete/);
              const result=JSON.parse(output);
              assert.match(result.text,/hello\s+world/i);
              assert.ok(Number.isFinite(result.rtf)&&result.rtf>=0);
              assert.deepEqual(external,[]);
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Record observed asset hashes (not reviewed manifest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-observed-asset-hashes
          path: ${{ runner.temp }}/voice-p2-observed-sha256.txt
          if-no-files-found: ignore
