name: First-run guide live smoke

on:
  push:
    branches: [main]
    paths:
      - 'quick-start.html'
      - 'api-guide.html'
      - 'account.html'
      - 'js/brand-ui.js'
      - 'js/character-ui.js'
      - 'js/quick-start-mode.js'
      - 'js/player-builder-v2.js'
      - 'js/story-start-readiness-core.js'
      - 'js/story-start-readiness.js'
      - 'css/player-builder-v2.css'
      - 'css/story-start-readiness.css'
      - 'css/first-run-desktop.css'
      - '.github/workflows/first-run-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-first-run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and onboarding links
        shell: bash
        run: |
          set -euo pipefail
          node --check js/brand-ui.js
          node --check js/character-ui.js
          node --check js/player-builder-v2.js
          node --check js/story-start-readiness-core.js
          node --check js/story-start-readiness.js
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const home = fs.readFileSync('js/brand-ui.js', 'utf8');
          const guide = fs.readFileSync('quick-start.html', 'utf8');
          const api = fs.readFileSync('api-guide.html', 'utf8');
          const account = fs.readFileSync('account.html', 'utf8');
          const detail = fs.readFileSync('js/character-ui.js', 'utf8');
          const quick = fs.readFileSync('js/quick-start-mode.js', 'utf8');
          const builder = fs.readFileSync('js/player-builder-v2.js', 'utf8');
          const readinessCore = fs.readFileSync('js/story-start-readiness-core.js', 'utf8');
          const readiness = fs.readFileSync('js/story-start-readiness.js', 'utf8');
          const builderCss = fs.readFileSync('css/player-builder-v2.css', 'utf8');
          const readinessCss = fs.readFileSync('css/story-start-readiness.css', 'utf8');
          const css = fs.readFileSync('css/first-run-desktop.css', 'utf8');
          for (const phrase of ['href="quick-start.html"', 'id="home-continue"', 'id="home-character-count"']) assert.ok(home.includes(phrase), `Missing homepage element: ${phrase}`);
          assert.equal((home.match(/href="quick-start\.html"/g) || []).length, 1, 'Homepage should expose one canonical first-run link');
          assert.ok(!home.includes('builder-api-guide'), 'Duplicate inline builder guide should be removed');
          for (const phrase of ['id="step-one"', 'id="step-two"', 'id="step-three"', '開始探索', '使用夜灣燈火', '使用自己的模型連線', 'https://openrouter.ai/keys', 'https://aistudio.google.com/apikey']) assert.ok(guide.includes(phrase), `Missing guide element: ${phrase}`);
          for (const phrase of ['路線 A：夜灣燈火', 'href="quick-start.html"', '路線 B：OpenRouter', '路線 C：Google Gemini', '路線 D：LM Studio 本地 AI']) assert.ok(api.includes(phrase), `Missing API reference route: ${phrase}`);
          for (const phrase of ['href="quick-start.html"', 'href="api-guide.html"', '第一次玩？三步開始']) assert.ok(account.includes(phrase), `Missing account navigation: ${phrase}`);
          assert.ok(detail.includes('class="detail-first-run" href="quick-start.html"'), 'Work detail first-run link missing');
          for (const phrase of ['bao-first-run-progress', '作品已選好', '模型連線', '開始故事', '快速開始（推薦）']) assert.ok(quick.includes(phrase), `Missing quick-start path: ${phrase}`);
          for (const phrase of ['STEP 2 · CONNECT', 'bao-first-run-ai-note', 'bao-connection-help', '使用夜灣燈火', '使用自己的模型連線']) assert.ok(builder.includes(phrase), `Missing builder onboarding route: ${phrase}`);
          for (const phrase of ['還缺連線金鑰', '還缺夜灣帳號登入', '還缺本機模型', '可以開始故事']) assert.ok(readinessCore.includes(phrase), `Missing readiness state: ${phrase}`);
          for (const phrase of ['bao-start-readiness', 'data-start-ready-summary', 'data-start-ready-action', 'data-bao-ready']) assert.ok(readiness.includes(phrase), `Missing readiness UI: ${phrase}`);
          assert.ok(readinessCss.includes('[data-ready="true"]'), 'Ready-state styling missing');
          assert.ok(!builderCss.includes('#builder-api-guide'), 'Dead builder guide CSS should be removed');
          assert.ok(css.includes('@media(min-width:1081px)'), 'Desktop styles missing');
          assert.ok(home.includes('css/first-run-desktop.css'), 'Stylesheet not loaded');
          console.log('First-run guide, preserved navigation IDs, CSS linkage: OK');
          NODE
      - name: Verify latest guide and stylesheet on live Pages
        shell: bash
        env:
          SITE_URL: https://yorubay.com/
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          for attempt in $(seq 1 50); do
            matched=true
            for file in quick-start.html api-guide.html account.html js/brand-ui.js js/character-ui.js js/quick-start-mode.js js/player-builder-v2.js js/story-start-readiness-core.js js/story-start-readiness.js css/player-builder-v2.css css/story-start-readiness.css css/first-run-desktop.css; do
              if ! curl -fsSL --max-time 15 "${SITE_URL}${file}?verify=${GITHUB_SHA}" -o "$verify_dir/content" \
                || ! cmp -s "$file" "$verify_dir/content"; then
                matched=false
                echo "Waiting for deployed file: ${file}"
              fi
            done
            if [[ "$matched" == true ]]; then
              echo "First-run files match ${GITHUB_SHA} on live Pages (attempt ${attempt})."
              exit 0
            fi
            echo "Waiting for current Pages version (${attempt}/50)..."
            sleep 5
          done
          echo 'Latest first-run guide and desktop styles not observed on live Pages.' >&2
          exit 1
