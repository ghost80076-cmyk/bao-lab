name: LM Studio browser smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lm-studio-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: LM Studio story and resume in Chromium
        run: npx playwright test tests/e2e/lm-studio.spec.cjs --project=chromium --reporter=line
      - name: Upload focused failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lm-studio-browser-smoke-trace
          path: test-results
          if-no-files-found: ignore
