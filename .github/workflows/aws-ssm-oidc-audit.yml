name: AWS SSM OIDC audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aws-ssm-oidc-audit.yml
      - tests/aws-ssm-oidc-workflow-core.cjs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-ssm-oidc-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show safe GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!requestUrl || !requestToken) {
              throw new Error("GitHub OIDC request environment is unavailable");
            }

            const url = new URL(requestUrl);
            url.searchParams.set("audience", "sts.amazonaws.com");

            const response = await fetch(url, {
              headers: {
                authorization: `Bearer ${requestToken}`,
              },
            });

            if (!response.ok) {
              throw new Error(`GitHub OIDC request failed with HTTP ${response.status}`);
            }

            const payload = await response.json();
            const jwt = String(payload.value || "");
            const segments = jwt.split(".");
            if (segments.length !== 3) {
              throw new Error("GitHub OIDC response did not contain a JWT");
            }

            const claims = JSON.parse(
              Buffer.from(segments[1], "base64url").toString("utf8")
            );

            const safeClaims = {
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              repository_owner: claims.repository_owner,
              ref: claims.ref,
              event_name: claims.event_name,
              job_workflow_ref: claims.job_workflow_ref,
            };

            console.log(JSON.stringify(safeClaims, null, 2));
          })().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::746698923199:role/YoruBayGitHubDeploy
          aws-region: ap-southeast-2
          role-session-name: yorubay-github-ssm-audit

      - name: Send read-only SSM command
        id: send
        shell: bash
        run: |
          set -euo pipefail
          COMMAND_ID="$(
            aws ssm send-command               --instance-ids i-00a22eb7d55a6ea30               --document-name AWS-RunShellScript               --comment "YoruBay GitHub OIDC SSM connectivity audit"               --parameters 'commands=["set -eu","echo YORUBAY_SSM_OK","systemctl is-active bao-backend.service","systemctl is-active amazon-ssm-agent"]'               --query 'Command.CommandId'               --output text
          )"
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            STATUS="$(
              aws ssm get-command-invocation                 --command-id "$COMMAND_ID"                 --instance-id i-00a22eb7d55a6ea30                 --query 'Status'                 --output text 2>/dev/null || true
            )"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation                   --command-id "$COMMAND_ID"                   --instance-id i-00a22eb7d55a6ea30                   --query '{Status:Status,Output:StandardOutputContent}'                   --output json
                exit 0
                ;;
              Pending|InProgress|Delayed|"")
                sleep 2
                ;;
              *)
                aws ssm get-command-invocation                   --command-id "$COMMAND_ID"                   --instance-id i-00a22eb7d55a6ea30                   --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'                   --output json || true
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for SSM command $COMMAND_ID" >&2
          exit 1
