name: Chat reading scroll

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reading-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check js/chat-reading-scroll.js
          node --check js/streaming-ui.js
      - name: Reading-specific regressions
        run: |
          node tests/chat-reading-scroll-core.cjs
          node tests/chat-reading-pipeline-core.cjs
          node tests/chat-presentation-core.cjs

  pages-live:
    if: github.event_name == 'push'
    needs: reading-scroll
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Confirm reading controller and streaming fix reached Pages
        shell: bash
        env:
          SITE_URL: https://ghost80076-cmyk.github.io/bao-lab/
          LIVE_VERIFY_ATTEMPTS: '50'
          LIVE_VERIFY_TIMEOUT: '12'
          LIVE_VERIFY_QUERY: sha
        run: bash scripts/verify-live-assets.sh js/chat-reading-scroll.js js/streaming-ui.js
