name: Story entry regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  story-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify relocated button insertion stays safe
        run: |
          if grep -R -nE 'aside\.insertBefore\((button|box),[[:space:]]*(exit|aside\.querySelector\("\.text-button"\))\)' js/; then
            echo 'Unsafe sidebar insertion found' >&2
            exit 1
          fi
      - name: Browser coverage
        run: echo "Story-entry browser regressions are covered by Fast Browser E2E."
