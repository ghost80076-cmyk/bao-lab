name: Snapshot original Chicofy portrait files (temporary)
on:
  push:
    branches:
      - fix/chicofy-opening-rotation-portrait-20261031
    paths:
      - .github/workflows/chicofy-portrait-snapshot-temporary.yml
permissions:
  contents: write
jobs:
  snapshot-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch original author-provided PNG URLs and verify binary signatures
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, struct, sys
          data=json.loads(pathlib.Path('docs/author-migrations/chicofy-six-timelines/assets.json').read_text())
          root=pathlib.Path('assets/characters/chicofy-six-timelines')
          root.mkdir(parents=True,exist_ok=True)
          for item in data['portraits']:
              url=item['source_url']
              if not url.startswith('https://objects.lunatalk.ai/asset/'):
                  raise RuntimeError('Unexpected remote origin')
              dest=root/(item['id']+'.png')
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (YoruBay author asset preservation)','Referer':'https://lunatalk.chat/'})
              with urllib.request.urlopen(request,timeout=25) as response:
                  body=response.read(12000000)
                  mime=response.headers.get('content-type','')
                  status=response.status
              if not body.startswith(b'\x89PNG\r\n\x1a\n') or len(body)<128 or len(body)>11000000:
                  raise ValueError(f"Invalid PNG for {item['id']}: {mime}, {len(body)} bytes")
              width,height=struct.unpack('>II',body[16:24])
              if width<64 or height<64 or width>8000 or height>10000:
                  raise ValueError(f"Invalid dimensions {width}x{height} for {item['id']}")
              dest.write_bytes(body)
              print(f"OK {item['id']}: {width}x{height}, {len(body)} bytes (HTTP {status})")
          PY
      - name: Commit only verified original author image bytes to this PR branch
        shell: bash
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add assets/characters/chicofy-six-timelines/*.png
          if git diff --cached --quiet; then
            echo 'All original files already tracked'
          else
            git commit -m 'assets(chicofy): snapshot six original authorized portraits'
            git push origin HEAD:fix/chicofy-opening-rotation-portrait-20261031
          fi
