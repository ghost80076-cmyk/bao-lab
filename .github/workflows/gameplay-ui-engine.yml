name: Gameplay UI Engine

on:
  push:
    branches: [main]
    paths:
      - 'js/gameplay-ui-core.js'
      - 'js/gameplay-ui.js'
      - 'js/gameplay-ui-composer-core.js'
      - 'js/gameplay-ui-preview*.js'
      - 'gameplay-ui-preview.html'
      - 'sw.js'
      - 'tests/gameplay-ui-preview-cache.test.mjs'
      - 'tests/pwa-install-contract.test.mjs'
      - 'tests/pwa-cache-safety.test.mjs'
      - 'js/stage-capability-core.js'
      - 'js/stage-capability.js'
      - 'js/bao-visual-ui.js'
      - 'js/phone-ui.js'
      - 'css/gameplay-ui.css'
      - 'tests/gameplay-ui-engine-core.cjs'
      - 'tests/gameplay-ui-composer-core.cjs'
      - 'tests/e2e/gameplay-ui-preview.spec.cjs'
      - 'tests/fixtures/gameplay-ui-preview-harness.html'
      - 'tests/stage-capability-core.cjs'
      - 'tests/lastlight-survivors-card.test.cjs'
      - 'data/characters/community/ca/lastlight-survivors*'
      - 'tests/e2e/gameplay-ui-engine.spec.cjs'
      - 'tests/e2e/stage-capability.spec.cjs'
      - 'tests/fixtures/gameplay-ui-demo-character.json'
      - 'docs/gameplay-ui-engine.md'
      - '.github/workflows/gameplay-ui-engine.yml'
      - '.github/actions/setup-chromium/**'
      - 'package.json'
      - 'package-lock.json'
      - 'js/character.js'
      - 'js/character-studio.js'
      - 'character-studio.html'
      - 'tests/character-studio-gameplay-ui-core.cjs'
      - 'index.html'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gameplay-ui-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check js/gameplay-ui-core.js
      - run: node --check js/gameplay-ui.js
      - run: node --check js/gameplay-ui-composer-core.js
      - run: node --check js/gameplay-ui-preview-protocol-core.js
      - run: node --check js/gameplay-ui-preview-stubs.js
      - run: node --check js/gameplay-ui-preview.js
      - run: node --check js/gameplay-ui-preview-client.js
      - run: node --check js/stage-capability-core.js
      - run: node --check js/stage-capability.js
      - run: node tests/stage-capability-core.cjs
      - run: node tests/gameplay-ui-engine-core.cjs
      - run: node tests/gameplay-ui-composer-core.cjs
      - run: node --test tests/gameplay-ui-preview-cache.test.mjs tests/pwa-install-contract.test.mjs tests/pwa-cache-safety.test.mjs
      - run: node tests/lastlight-survivors-card.test.cjs
      - run: node tests/character-studio-gameplay-ui-core.cjs
      - run: node --check js/character-studio.js
      - name: Browser coverage
        run: echo "Gameplay UI browser regression is covered by Fast Browser E2E."

  browser-gameplay-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Native Gameplay UI and Stage capability browser regression
        run: >-
          npx playwright test
          tests/e2e/gameplay-ui-engine.spec.cjs
          tests/e2e/stage-capability.spec.cjs
          tests/e2e/gameplay-ui-preview.spec.cjs
          --project=chromium

  browser-preview-cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test tests/e2e/gameplay-ui-preview.spec.cjs --project=${{ matrix.browser }}
