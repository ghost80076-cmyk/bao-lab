name: Character library recovery

on:
  push:
    branches: [fix/character-studio-library-sync-20260921]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover multiple cards and preserve R18 edits
        run: node --test tests/character-library-repair-core.cjs
