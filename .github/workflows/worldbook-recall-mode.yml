name: Worldbook recall modes
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/worldbook-library*.js'
      - 'js/lorebook.js'
      - 'js/character.js'
      - 'js/prompt-cache.js'
      - 'data/world-simulator-general*.json'
      - 'data/world-simulator-layer-review.json'
      - 'data/astral-worldbook-*.json'
      - 'data/simulator-original-worldbook-*.json'
      - 'scripts/migrate-simulator-worldbooks.py'
      - 'tests/simulator-original-worldbook-*.cjs'
      - 'tests/simulator-original-worldbook-audit.py'
      - 'scripts/migrate-astral-worldbook.py'
      - 'tests/astral-worldbook-core.cjs'
      - 'scripts/audit-world-simulator-general.py'
      - 'tests/world-simulator-general-core.cjs'
      - 'tests/world-simulator-source-audit.py'
      - 'tests/*worldbook*.cjs'
      - 'tests/lorebook-core.cjs'
      - 'tests/e2e/worldbook-recall-mode.spec.cjs'
      - '.github/workflows/worldbook-recall-mode.yml'
  push:
    branches: [main]
    paths:
      - 'js/worldbook-library*.js'
      - 'js/lorebook.js'
      - 'js/character.js'
      - '.github/workflows/worldbook-recall-mode.yml'
      - 'data/world-simulator-general*.json'
      - 'data/world-simulator-layer-review.json'
      - 'data/astral-worldbook-*.json'
      - 'data/simulator-original-worldbook-*.json'
      - 'scripts/migrate-simulator-worldbooks.py'
      - 'tests/simulator-original-worldbook-*.cjs'
      - 'tests/simulator-original-worldbook-audit.py'
      - 'scripts/migrate-astral-worldbook.py'
      - 'tests/astral-worldbook-core.cjs'
      - 'scripts/audit-world-simulator-general.py'
      - 'tests/world-simulator-general-core.cjs'
      - 'tests/world-simulator-source-audit.py'
permissions:
  contents: read
jobs:
  recall-and-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Recall and stable-prefix regression
        run: |
          node tests/worldbook-library-core.cjs
          node tests/astral-worldbook-core.cjs
          node tests/simulator-original-worldbook-core.cjs
          python3 tests/simulator-original-worldbook-audit.py
          node tests/world-simulator-general-core.cjs
          python3 tests/world-simulator-source-audit.py
          node tests/worldbook-library-runtime.cjs
          node tests/lorebook-core.cjs
          node tests/character-import-core.cjs
          node tests/prompt-cache-core.cjs
          node tests/prompt-orchestrator-core.cjs
          node tests/sunrise-prompt-layering-core.cjs
      - run: npx playwright test tests/e2e/worldbook-recall-mode.spec.cjs --project=chromium
  deployed-general-catalog:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public catalog, review metadata and loader bytes
        run: |
          python - <<'PY'
          import hashlib, pathlib, time, urllib.request
          pending = {"data/world-simulator-general-library.json", "data/world-simulator-general-source-map.json", "data/world-simulator-layer-review.json", "data/astral-worldbook-library.json", "data/astral-worldbook-source-map.json", "data/simulator-original-worldbook-library.json", "data/simulator-original-worldbook-source-map.json", "js/worldbook-library-core.js", "js/worldbook-library.js", "js/site-ui.js", "data/characters/community/7c/xia-yuhan-av-industry.json"}
          for attempt in range(30):
              for path in list(pending):
                  try:
                      request = urllib.request.Request("https://yorubay.com/" + path + "?verify=" + str(time.time_ns()), headers={"Cache-Control":"no-cache"})
                      with urllib.request.urlopen(request, timeout=8) as response:
                          live = response.read()
                      if hashlib.sha256(live).digest() == hashlib.sha256(pathlib.Path(path).read_bytes()).digest():
                          pending.remove(path)
                  except Exception:
                      pass
              if not pending:
                  print("PASS deployed general worldbook catalog, review metadata and loader match commit")
                  break
              time.sleep(5)
          if pending:
              raise SystemExit("Deployment mismatch: " + str(sorted(pending)))
          PY
