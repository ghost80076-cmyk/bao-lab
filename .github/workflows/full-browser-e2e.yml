name: Full Browser E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/full-browser-e2e.yml'
      - 'scripts/check-full-browser-shards.cjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-browser-e2e.yml'
      - 'scripts/check-full-browser-shards.cjs'
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard-coverage:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify every discovered test belongs to exactly one shard
        run: node scripts/check-full-browser-shards.cjs
  cross-browser-full:
    name: Full E2E · ${{ matrix.browser }} · ${{ matrix.shard }}/4
    needs: shard-coverage
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Run full desktop and mobile E2E
        run: npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4 --workers=2
      - name: Upload full browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  live-pages-full:
    name: Full live Pages verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: cross-browser-full
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed Pages content
        run: node tests/pages-content-check.cjs
      - name: Verify live Pages official logo and Discord contact
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/community-brand.spec.cjs --project=chromium
      - name: Verify live Pages author guidance and relay probe
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/author-diagnostics.spec.cjs --project=chromium
      - name: Verify live Pages character import and reload
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/character-import.spec.cjs --project=chromium
      - name: Verify live Pages provider diagnostics
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/provider-diagnostics.spec.cjs --project=chromium
      - name: Verify live Pages memory flow
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/memory-preferences.spec.cjs --project=chromium
      - name: Verify live Pages Context Pack resume
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/context-pack-resume.spec.cjs --project=chromium
      - name: Verify live Pages 1000-round story stress
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/long-story-stress.spec.cjs --project=chromium
