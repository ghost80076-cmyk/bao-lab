name: Full Browser E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  cross-browser-full:
    name: Full E2E · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run full desktop and mobile E2E
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - name: Upload full browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  live-pages-full:
    name: Full live Pages verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: cross-browser-full
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed Pages content
        run: node tests/pages-content-check.cjs
      - name: Verify live Pages official logo and Discord contact
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/community-brand.spec.cjs --project=chromium
      - name: Verify live Pages author guidance and relay probe
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/author-diagnostics.spec.cjs --project=chromium
      - name: Verify live Pages character import and reload
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/character-import.spec.cjs --project=chromium
      - name: Verify live Pages provider diagnostics
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/provider-diagnostics.spec.cjs --project=chromium
      - name: Verify live Pages memory flow
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/memory-preferences.spec.cjs --project=chromium
      - name: Verify live Pages Context Pack resume
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/context-pack-resume.spec.cjs --project=chromium
      - name: Verify live Pages 1000-round story stress
        env:
          BAO_LIVE_URL: https://ghost80076-cmyk.github.io/bao-lab/
        run: npm run test:e2e -- tests/e2e/long-story-stress.spec.cjs --project=chromium
