name: Author regex inline and dock
on:
  push:
    paths:
      - 'js/author-regex-core.js'
      - 'data/characters/community/**/*.regex.json'
      - 'js/author-regex-card-bind.js'
      - 'js/author-regex-compat.js'
      - 'js/author-regex-inline.js'
      - 'js/author-regex-dock.js'
      - 'js/regex-chat.js'
      - 'tests/e2e/author-regex-inline.spec.cjs'
      - 'tests/e2e/community-author-regex-audit.spec.cjs'
      - 'tests/e2e/unread-afterglow-seoul.spec.cjs'
      - 'tests/e2e/dont-tell-him.spec.cjs'
      - 'tests/e2e/midnight-paper-bride-mio.spec.cjs'
      - 'tests/e2e/author-regex-dock.spec.cjs'
      - 'tests/e2e/author-regex-legacy-input.spec.cjs'
      - 'tests/e2e/author-regex-ui-save.spec.cjs'
      - '.github/workflows/author-regex-inline.yml'
      - '.github/actions/setup-chromium/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'js/author-regex-core.js'
      - 'data/characters/community/**/*.regex.json'
      - 'js/author-regex-compat.js'
      - 'js/author-regex-inline.js'
      - 'js/author-regex-dock.js'
      - 'js/regex-chat.js'
      - 'tests/e2e/author-regex-inline.spec.cjs'
      - 'tests/e2e/community-author-regex-audit.spec.cjs'
      - 'tests/e2e/unread-afterglow-seoul.spec.cjs'
      - 'tests/e2e/dont-tell-him.spec.cjs'
      - 'tests/e2e/midnight-paper-bride-mio.spec.cjs'
      - 'tests/e2e/author-regex-dock.spec.cjs'
      - 'tests/e2e/author-regex-legacy-input.spec.cjs'
      - 'tests/e2e/author-regex-ui-save.spec.cjs'
      - '.github/workflows/author-regex-inline.yml'
      - '.github/actions/setup-chromium/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-chromium
      - run: npm run test:e2e -- tests/e2e/author-regex-inline.spec.cjs tests/e2e/community-author-regex-audit.spec.cjs tests/e2e/author-regex-dock.spec.cjs tests/e2e/author-regex-legacy-input.spec.cjs tests/e2e/author-regex-ui-save.spec.cjs tests/e2e/unread-afterglow-seoul.spec.cjs tests/e2e/midnight-paper-bride-mio.spec.cjs tests/e2e/dont-tell-him.spec.cjs --project=chromium
