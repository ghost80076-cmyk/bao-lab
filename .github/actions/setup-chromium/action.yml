name: Set up Chromium tests
description: Install the locked Node dependencies and Playwright Chromium on Ubuntu runners.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - shell: bash
      run: npm ci
    - shell: bash
      run: npx playwright install --with-deps chromium
