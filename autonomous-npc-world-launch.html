<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自主NPC世界｜開始故事 · BAO/LAB</title><style>*{box-sizing:border-box}body{margin:0;background:#151126;color:#fff;font:16px/1.6 system-ui,sans-serif}.setup{max-width:850px;margin:auto;padding:18px}.hero{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:18px;overflow:hidden}.hero img{width:120px;height:165px;object-fit:cover}h1{font-size:clamp(1.2rem,4vw,2rem)}fieldset{border:1px solid #655487;border-radius:14px;margin:14px 0;padding:14px}label{display:inline-flex;align-items:center;gap:6px;margin:6px}input,select,button{font:inherit}input[type=text]{width:100%;padding:10px;background:#241c39;color:white;border:1px solid #9b87ce;border-radius:8px}button{padding:12px 20px;border:0;border-radius:12px;background:#7664dc;color:white;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffd700}#app-frame{display:none;width:100%;height:100dvh;border:0}small{color:#d7caef}@media(max-width:480px){.hero img{width:90px;height:140px}.setup{padding:12px}}</style></head><body><main class="setup" id="setup"><header class="hero"><img src="https://i.meee.com.tw/CZubuJ9.jpg" alt="自主NPC世界封面"><div><h1>🌟 動態世界模擬器</h1><p>NPC 不會 24 小時等你。</p></div></header><form id="start"><fieldset><legend>🖥️ 顯示模式</legend><label><input type="radio" name="display" value="text">純文字</label><label><input type="radio" name="display" value="ui" checked>網站介面</label><p><small>作者 HTML 可在正式聊天的場景 HTML 功能另行設定。</small></p></fieldset><fieldset><legend>🎮 遊戲模式</legend><label><input type="radio" name="mode" value="immersive" checked>🎭 單角色</label><label><input type="radio" name="mode" value="world">🌍 完整世界</label><label><input type="radio" name="mode" value="custom">⚙️ 自訂開局</label></fieldset><fieldset><legend>🌍 世界觀</legend><select id="world"><option>現代都市</option><option>成人校園日常</option><option>都市奇幻</option><option>賽博朋克</option><option>奇幻冒險</option><option>末日廢土</option><option>科幻太空</option><option>恐怖驚悚</option><option>自訂世界觀</option></select><p><label for="custom-world">補充設定</label><input id="custom-world" type="text" maxlength="300" placeholder="地點、NPC、開場情境……"></p></fieldset><button type="submit">⚡ 進入正式故事建立器</button><p id="status" role="status" aria-live="polite"></p><small>API Key 僅在 BAO/LAB 正式建立器內輸入；本頁不傳送或儲存金鑰。</small></form></main><iframe id="app-frame" title="BAO/LAB 正式故事建立器" src="./index.html"></iframe><script>const frame=document.getElementById('app-frame'),status=document.getElementById('status');document.getElementById('start').addEventListener('submit',async e=>{e.preventDefault();status.textContent='正在載入 BAO/LAB……';try{const f=frame.contentWindow;let app;for(let i=0;i<100;i++){try{app=f.eval('App');if(app?.characters?.length)break}catch{}await new Promise(r=>setTimeout(r,100))}if(!app?.characters?.some(c=>c.id==='autonomous-npc-world'))throw Error('角色卡尚未載入，請重新整理。');app.openCharacter('autonomous-npc-world');app.openBuilder();const mode=document.querySelector('input[name="mode"]:checked').value,display=document.querySelector('input[name="display"]:checked').value;for(const [name,value] of [['narrative-mode',mode==='immersive'?'immersive':'world'],['display-mode',display]]){const radio=f.document.querySelector('input[name="'+name+'"][value="'+value+'"]');if(!radio)throw Error('建立器選項尚未載入');radio.checked=true;radio.dispatchEvent(new f.Event('change',{bubbles:true}))}const world=document.getElementById('world').value,detail=document.getElementById('custom-world').value.trim(),original=app.collectConfig.bind(app);app.collectConfig=function(){const cfg=original(),extra=['【本次開局世界觀】'+world,detail?'【開局補充】'+detail:'',mode==='custom'?'【開局方式】玩家自訂':''].filter(Boolean).join('\n');cfg.persona.extra=[cfg.persona.extra,extra].filter(Boolean).join('\n');return cfg};document.getElementById('setup').hidden=true;frame.style.display='block';frame.focus()}catch(err){status.textContent=err.message||'無法載入建立器。'}});</script></body></html>
