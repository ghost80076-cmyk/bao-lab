<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自主NPC世界｜開始故事 · BAO/LAB</title><style>*{box-sizing:border-box}body{margin:0;background:#151126;color:#fff;font:16px/1.6 system-ui,sans-serif}.setup{max-width:860px;margin:auto;padding:18px}.hero{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:20px;overflow:hidden}.hero img{width:130px;height:170px;object-fit:cover}.hero h1{font-size:clamp(1.2rem,4vw,2rem)}fieldset{border:1px solid #655487;border-radius:15px;margin:14px 0;padding:15px}legend{font-weight:bold}label{display:inline-flex;align-items:center;gap:6px;margin:5px 12px 5px 0}input,select,button{font:inherit}input[type=text]{width:100%;padding:10px;background:#241c39;color:white;border:1px solid #9b87ce;border-radius:8px}button{padding:12px 20px;border:0;border-radius:12px;background:#7664dc;color:white;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffd700}#app-frame{display:none;width:100%;height:100dvh;border:0;background:white}#status{min-height:1.5em}small{color:#d7caef}@media(max-width:480px){.hero img{width:100px;height:150px}.setup{padding:12px}}</style></head><body><main class="setup" id="setup"><header class="hero"><img src="https://i.meee.com.tw/CZubuJ9.jpg" alt="自主NPC世界封面" referrerpolicy="no-referrer"><div><h1>🌟 動態世界模擬器</h1><p>NPC 不會 24 小時等你。選好世界，開始你的故事。</p></div></header><form id="start"><fieldset><legend>🖥️ 顯示模式</legend><label><input type="radio" name="display" value="text">純文字</label><label><input type="radio" name="display" value="ui" checked>網站介面</label><small>作者 HTML 請在網站支援的場景 HTML 設定中另行啟用，不會執行舊平台 hc-btn。</small></fieldset><fieldset><legend>🎮 遊戲模式</legend><label><input type="radio" name="mode" value="immersive" checked>🎭 單角色</label><label><input type="radio" name="mode" value="world">🌍 完整世界</label><label><input type="radio" name="mode" value="custom">⚙️ 自訂開局</label></fieldset><fieldset><legend>🌍 世界觀</legend><select id="world"><option>現代都市</option><option>成人校園日常</option><option>都市奇幻</option><option>賽博朋克</option><option>奇幻冒險</option><option>末日廢土</option><option>科幻太空</option><option>恐怖驚悚</option><option>自訂世界觀</option></select><label for="custom-world">補充設定（選填）</label><input id="custom-world" type="text" maxlength="300" placeholder="地點、NPC、開場情境……"></fieldset><button type="submit">⚡ 進入 BAO/LAB 建立故事</button><p id="status" role="status" aria-live="polite"></p><small>不在此頁收集 API Key；進入原本的 BAO/LAB 建立器後才設定模型與 API。既有故事不會在這一步被覆寫。</small></form></main><iframe id="app-frame" title="BAO/LAB 正式故事建立器" src="./index.html"></iframe><script>const frame=document.getElementById('app-frame'),status=document.getElementById('status');document.getElementById('start').addEventListener('submit',async e=>{e.preventDefault();status.textContent='正在載入 BAO/LAB 建立器……';const f=frame.contentWindow;for(let i=0;i<100&&!f?.App?.characters?.length;i++)await new Promise(r=>setTimeout(r,100));try{if(!f?.App?.characters?.some(c=>c.id==='autonomous-npc-world'))throw Error('尚未載入角色卡，請重新整理再試。');const app=f.App;app.openCharacter('autonomous-npc-world');app.openBuilder();const mode=document.querySelector('input[name="mode"]:checked').value;const display=document.querySelector('input[name="display"]:checked').value;const m=f.document.querySelector('input[name="narrative-mode"][value="'+(mode==='immersive'?'immersive':'world')+'"]'),d=f.document.querySelector('input[name="display-mode"][value="'+display+'"]');m.checked=true;m.dispatchEvent(new Event('change',{bubbles:true}));d.checked=true;d.dispatchEvent(new Event('change',{bubbles:true}));const world=document.getElementById('world').value,detail=document.getElementById('custom-world').value.trim();const original=app.collectConfig.bind(app);app.collectConfig=function(){const cfg=original();const extra=['【本次開局世界觀】'+world,detail?'【開局補充】'+detail:'',mode==='custom'?'【開局方式】玩家自訂':''].filter(Boolean).join('\n');cfg.persona.extra=[cfg.persona.extra,extra].filter(Boolean).join('\n');return cfg};document.getElementById('setup').hidden=true;frame.style.display='block';frame.focus()}catch(err){status.textContent=err.message||'無法載入建立器。'}});</script></body></html>
