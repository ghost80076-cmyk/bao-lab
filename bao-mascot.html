<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>BAO｜BAO/LAB 官方吉祥物</title>
<meta name="description" content="認識 BAO/LAB 官方吉祥物包包：能在肉包精靈與人形之間自由切換的網站小助手。">
<link rel="icon" type="image/svg+xml" href="assets/bao-mark.svg">
<link rel="preload" href="assets/bao-human-v2.webp" as="image" type="image/webp">
<style>
:root{color-scheme:dark;--bg:#090b10;--text:#f5f1f3;--muted:#aaa2aa;--pink:#f4a8c4;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}html{overflow-x:hidden}body{margin:0;min-width:0;overflow-x:hidden;background:radial-gradient(circle at 75% 10%,rgba(244,168,196,.16),transparent 28%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.shell{width:min(1120px,calc(100% - 32px));margin:auto}.top{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;color:inherit;text-decoration:none;font-weight:900;letter-spacing:.08em}.back{color:var(--muted);text-decoration:none;white-space:nowrap}.hero{min-height:calc(100vh - 70px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:clamp(20px,4vw,48px);align-items:center;padding:46px 0}.copy,.visual{min-width:0}.kicker{color:var(--pink);font-size:12px;letter-spacing:.16em;font-weight:900}.copy h1{font-size:clamp(54px,9vw,108px);line-height:.92;margin:18px 0 22px;letter-spacing:-.06em}.copy h2{font-size:clamp(22px,3vw,32px);margin:0 0 18px}.copy p{color:#cbc4ca;line-height:1.85;max-width:640px;overflow-wrap:anywhere}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.chips span{border:1px solid rgba(244,168,196,.24);background:rgba(244,168,196,.08);color:#f2c7d7;padding:8px 12px;border-radius:999px;font-size:13px}.visual{position:relative;min-height:540px;display:flex;align-items:flex-end;justify-content:center;isolation:isolate}.visual:before{content:"";position:absolute;inset:7% 2% 3%;z-index:-1;border-radius:48% 48% 24px 24px;background:linear-gradient(180deg,rgba(244,168,196,.13),rgba(156,140,255,.03));border:1px solid var(--line)}.visual img.human{display:block;width:min(100%,430px);height:auto;max-height:660px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 24px 32px rgba(0,0,0,.3))}.bun{position:absolute;right:5%;bottom:5%;width:100px;height:100px;background:#11141be8;border:1px solid var(--line);border-radius:24px;padding:12px}.note{font-size:12px;color:var(--muted);margin-top:22px}.open-bao{margin-top:20px;padding:12px 20px;border:1px solid #f4a8c4;border-radius:999px;background:#f4a8c4;color:#2b1e29;font:inherit;font-weight:750;cursor:pointer}.open-bao:hover,.open-bao:focus-visible{background:#ffcfdf;outline:2px solid #ffd4e5;outline-offset:2px}@media(max-width:900px){.hero{grid-template-columns:minmax(0,1fr);gap:20px;padding:32px 0 110px}.visual{min-height:380px}.visual img.human{width:min(86%,360px);max-height:470px}.bun{right:9%;width:82px;height:82px}.copy h1{font-size:68px}}@media(max-width:420px){.shell{width:calc(100% - 28px)}.top{min-height:60px}.visual{min-height:330px}.visual img.human{width:min(85%,300px)}.copy h1{font-size:60px}}
</style>
</head>
<body><div class="shell"><header class="top"><a class="brand" href="./"><img src="assets/bao-mark.svg" width="30" height="30" alt="">BAO/LAB</a><a class="back" href="./">返回首頁 →</a></header><main class="hero"><section class="copy"><div class="kicker">OFFICIAL MASCOT · 01</div><h1>BAO</h1><h2>小小的肉包，裝著無限的故事。</h2><p>BAO 是 BAO/LAB 的官方吉祥物與小助手。她能在肉包精靈與人形之間自由切換；人形以奶白短髮、粉紫眼睛、黑粉蝴蝶結與 X 字髮夾作為固定識別。個性親切、俏皮、好奇，偶爾有一點小惡魔感。</p><div class="chips"><span>肉包 ⇄ 人形</span><span>女性外型 · 中性氣質</span><span>黑 × 白 × 粉</span><span>BAO/LAB 官方小助手</span></div><button class="open-bao" id="bao-page-open" type="button">找包包聊聊（固定台詞）</button><p class="note">網站小助手不使用 AI／API，也不讀取故事或金鑰。Discord 互動版本尚未推出。</p></section><section class="visual" aria-label="BAO 官方角色立繪"><img class="human" src="assets/bao-human-v2.webp" alt="BAO/LAB 官方吉祥物 BAO 人形立繪" width="430" height="573" onerror="this.onerror=null;this.src='assets/bao-bun.svg';"><img class="bun" src="assets/bao-bun.svg" alt="BAO 肉包型態" width="100" height="100"></section></main></div>
<script src="js/bao-mascot.js?v=2"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const human = document.querySelector('#bao-mascot-root .bao-mascot-human');
  if (human) { human.src = 'assets/bao-human-v2.webp'; human.onerror = () => { human.onerror = null; human.src = 'assets/bao-bun.svg'; }; }
  document.getElementById('bao-page-open')?.addEventListener('click', () => {
    const launcher = document.getElementById('bao-mascot-launch');
    const root = document.getElementById('bao-mascot-root');
    if (!launcher || !root) return;
    if (root.hidden) {
      try { const data = JSON.parse(localStorage.getItem('bao-lab:mascot:v1') || '{}'); localStorage.setItem('bao-lab:mascot:v1', JSON.stringify({...data,disabled:false})); } catch {}
      location.reload();
      return;
    }
    if (launcher.getAttribute('aria-expanded') !== 'true') launcher.click();
  });
});
</script>
</body></html>
