<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YoruBay 帳號與燈火｜夜灣</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="assets/bao-mark.svg">
<link rel="stylesheet" href="css/brand-home.css">
<link rel="stylesheet" href="css/base.css">
<style>
body{min-height:100vh;background:#101118;color:#f5f1ff}
.yb-wrap{width:min(720px,calc(100% - 28px));margin:28px auto 64px}
.yb-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.yb-top a{color:inherit;text-decoration:none}
.yb-card{background:#181a24;border:1px solid rgba(255,255,255,.11);border-radius:22px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.yb-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.yb-tabs button{border:1px solid rgba(255,255,255,.13);background:#222532;color:#ddd8ec;border-radius:999px;padding:8px 13px;cursor:pointer}
.yb-tabs button.active{background:#eee8ff;color:#171821}
.yb-panel[hidden]{display:none}
.yb-form{display:grid;gap:13px}
.yb-form label{display:grid;gap:6px;color:#c8c4d6;font-size:13px}
.yb-form input{box-sizing:border-box;width:100%;background:#10121a;border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:11px;padding:11px 12px;font:inherit}
.yb-primary,.yb-secondary{border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}
.yb-primary{border:0;background:#eee8ff;color:#171821}
.yb-secondary{border:1px solid rgba(255,255,255,.14);background:#232633;color:#eee}
.yb-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.yb-note{font-size:13px;line-height:1.65;color:#aaa6b8}.yb-help-links{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 18px}.yb-help-links a{color:#d9ccff;font-size:12px;text-decoration:none}.yb-help-links a:hover{text-decoration:underline;text-underline-offset:3px}
.yb-error{min-height:20px;color:#ff9d9d;font-size:13px;margin-top:10px}
.yb-box{background:#10121a;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;margin:12px 0}
.yb-row{display:flex;justify-content:space-between;gap:16px;padding:6px 0}
.yb-row span{color:#aaa6b8;font-size:13px}.yb-row b{text-align:right;word-break:break-all}
.yb-wallet{font-size:32px;font-weight:850;margin:4px 0 2px}
.yb-recovery{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all;background:#0d0f16;border:1px dashed rgba(255,255,255,.22);border-radius:12px;padding:12px;margin:10px 0}
.yb-packages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.yb-package{background:#222532;border-radius:11px;padding:11px;font-size:13px}
.yb-usage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.yb-usage-head .yb-note{margin:4px 0 0}
.yb-usage-total{font-size:24px;font-weight:850;margin:12px 0 2px}
.yb-usage-meta{font-size:12px;line-height:1.6;color:#aaa6b8}
.yb-usage-list{display:grid;gap:8px;margin-top:12px}
.yb-usage-item{background:#171923;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 11px}
.yb-usage-item-main{display:flex;align-items:center;justify-content:space-between;gap:12px}
.yb-usage-item-model{font-size:13px;font-weight:750;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yb-usage-item-points{font-size:13px;font-weight:800;white-space:nowrap}
.yb-usage-item-sub{margin-top:4px;color:#8f8b9f;font-size:11px;line-height:1.55}
.yb-usage-empty{padding:12px 0 2px;color:#aaa6b8;font-size:13px;line-height:1.65}
@media(max-width:600px){.yb-card{padding:18px}.yb-packages{grid-template-columns:1fr}.yb-usage-head{align-items:stretch;flex-direction:column}.yb-usage-head .yb-secondary{align-self:flex-start}}
</style>
<link rel="stylesheet" href="css/account-v2.css?v=2">
</head>
<body>
<div class="yb-wrap">
  <div class="yb-top">
    <a href="index.html"><b>← 夜灣 YoruBay</b></a>
    <span class="chip">YoruBay Account</span>
  </div>
  <main class="yb-card">
    <section class="yb-account-hero">
      <div>
        <div class="eyebrow">BAO ACCOUNT · OPTIONAL ONLINE SERVICES</div>
        <h1>帳號與燈火</h1>
        <p class="yb-note">登入只在你主動使用夜灣燈火與線上服務時需要。自己的模型連線、本地故事、角色、記憶與世界狀態不需要登入。</p>
      </div>
      <img src="assets/bao-bun.svg" width="84" height="84" alt="包包">
    </section>
    <div class="yb-local-first"><b>故事仍然留在你手上</b><span>登入不是讀取私人故事的必要條件；自己的連線金鑰（API Key）也不會存進帳號。</span></div>
    <nav class="yb-help-links" aria-label="開始故事與連線說明"><a href="quick-start.html">第一次玩？三步開始 →</a><a href="api-guide.html">模型連線完整說明 →</a></nav>

    <div class="yb-tabs">
      <button type="button" data-tab="login">登入</button>
      <button type="button" data-tab="register">建立帳號</button>
      <button type="button" data-tab="recover">恢復帳號</button>
      <button type="button" data-tab="account" hidden>我的帳號</button>
    </div>

    <section class="yb-panel" data-panel="login">
      <form class="yb-form" id="login-form">
        <label>帳號<input name="username" autocomplete="username" required maxlength="32"></label>
        <label>密碼<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
        <button class="yb-primary" type="submit">登入夜灣帳號</button>
      </form>
      <div class="yb-error" id="login-error"></div>
    </section>

    <section class="yb-panel" data-panel="register" hidden>
      <form class="yb-form" id="register-form">
        <label>顯示名稱<input name="display_name" autocomplete="nickname" required maxlength="50"></label>
        <label>登入帳號<input name="username" autocomplete="username" required maxlength="32" placeholder="3–32 字元，英文／數字／._-"></label>
        <label>密碼<input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128"></label>
        <label>確認密碼<input name="password_confirm" type="password" autocomplete="new-password" required minlength="10" maxlength="128"></label>
        <button class="yb-primary" type="submit">建立夜灣帳號</button>
      </form>
      <p class="yb-note">公開註冊已開放。密碼與恢復碼不會以明文保存在夜灣帳號資料庫。</p>
      <div class="yb-error" id="register-error"></div>
    </section>

    <section class="yb-panel" data-panel="recover" hidden>
      <form class="yb-form" id="recover-form">
        <label>玩家編號<input name="public_id" autocomplete="off" required placeholder="YR-XXXX-XXXX"></label>
        <label>恢復碼<input name="recovery_code" autocomplete="off" required placeholder="YBRC-...."></label>
        <label>新密碼<input name="new_password" type="password" autocomplete="new-password" required minlength="10" maxlength="128"></label>
        <button class="yb-primary" type="submit">恢復帳號</button>
      </form>
      <p class="yb-note">恢復成功後，舊恢復碼會失效，系統會產生一組新的恢復碼。</p>
      <div class="yb-error" id="recover-error"></div>
    </section>

    <section class="yb-panel" data-panel="account" hidden>
      <div id="account-body"></div>
    </section>
  </main>
</div>
<script>
(function(){
  "use strict";
  var BASE="https://api.yorubay.com";
  var LEGACY_KEY="yorubay:session";
  var SESSION_HINT_KEY="yorubay:session:active";
  var legacyToken=localStorage.getItem(LEGACY_KEY)||"";
  var profile=null;
  var authorIdentity=null;
  var authorProfiles={};

  function markSignedIn(){
    localStorage.setItem(SESSION_HINT_KEY,"1");
    localStorage.removeItem(LEGACY_KEY);
    legacyToken="";
  }
  function markSignedOut(){
    localStorage.removeItem(SESSION_HINT_KEY);
    localStorage.removeItem(LEGACY_KEY);
    legacyToken="";
  }
  function validSessionToken(value){
    return /^yb_s_[A-Za-z0-9_-]{30,}$/.test(String(value||"").trim());
  }
  function rememberLegacySession(data){
    var token=String(data&&data.session_token||"").trim();
    if(!validSessionToken(token)) return false;
    legacyToken=token;
    localStorage.setItem(LEGACY_KEY,token);
    localStorage.setItem(SESSION_HINT_KEY,"1");
    return true;
  }
  function markLegacySignedIn(){
    localStorage.setItem(SESSION_HINT_KEY,"1");
    if(legacyToken) localStorage.setItem(LEGACY_KEY,legacyToken);
  }

  function msg(id,text){document.getElementById(id).textContent=text||"";}
  function points(value){
    var n=Number(value||0);
    if(!Number.isFinite(n)) n=0;
    return (n*1000).toLocaleString("zh-TW",{minimumFractionDigits:0,maximumFractionDigits:1})+" 點";
  }
  async function call(path,options,auth){
    options=options||{};
    var headers=new Headers(options.headers||{});
    if(options.body&&!headers.has("Content-Type")) headers.set("Content-Type","application/json");
    if(auth) headers.set("Authorization","Bearer "+auth);
    var response;
    var credentials=options.credentials||"include";
    try{response=await fetch(BASE+path,Object.assign({},options,{headers:headers,credentials:credentials}));}
    catch(error){
      var transportError=new Error("無法連線夜灣帳號服務。");
      transportError.code="transport";
      throw transportError;
    }
    var data={};try{data=await response.json();}catch(e){}
    if(!response.ok){
      var map={
        unauthorized:"登入已失效，請重新登入。",
        invalid_credentials:"帳號或密碼不正確。",
        invalid_registration:"帳號資料不符合規則。帳號需 3–32 字元，密碼至少 10 字元。",
        username_taken:"這個帳號名稱已有人使用。",
        registration_closed:"目前尚未開放新帳號註冊。",
        invalid_recovery_request:"恢復資料格式不正確。",
        invalid_recovery_credentials:"玩家編號或恢復碼不正確。",
        account_required:"只有夜灣登入帳號可以建立作者身份。",
        invalid_author_id:"作者 ID 只能使用小寫英數、底線與連字號，長度 2–64 字元。",
        author_id_taken:"這個作者 ID 已由其他帳號使用。",
        author_id_reserved:"這個作者 ID 已存在公開作者資料，不能直接認領；請由管理員協助綁定。",
        author_identity_limit_reached:"目前每個帳號先提供一個作者身份；之後若需要筆名或團隊身份再擴充。",
        author_name_required:"請填寫玩家會看到的作者名稱。",
        invalid_author_support_url:"支持作者連結必須是 HTTPS 網址。",
        author_support_limit_reached:"最多可以設定 5 個外部支持方式。",
        author_identity_not_owned:"這個作者身份不屬於目前登入帳號。",
        github_publish_not_configured:"作者公開資料目前暫時無法送審。",
        github_publish_failed:"建立作者資料 PR 失敗，請稍後再試。"
      };
      var serviceError=new Error(map[data&&data.error]||("夜灣帳號服務錯誤（HTTP "+response.status+"）。"));
      serviceError.code=data&&data.error||"http_error";
      serviceError.status=response.status;
      throw serviceError;
    }
    return data;
  }
  function esc(value){
    return String(value==null?"":value).replace(/[&<>"']/g,function(ch){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch];
    });
  }
  async function loadAuthorContext(){
    authorIdentity=null;
    authorProfiles={};

    try{
      var owned=await call("/me/authors",{method:"GET",credentials:"include"},legacyToken||undefined);
      if(Array.isArray(owned&&owned.authors)&&owned.authors.length) authorIdentity=owned.authors[0];
    }catch(error){
      if(error&&(error.code==="transport"||error.code==="not_found"||error.status===404)) return;
      throw error;
    }

    try{
      var response=await fetch("data/authors.json",{cache:"no-store"});
      var directory=response.ok?await response.json():null;
      if(directory&&Array.isArray(directory.authors)){
        directory.authors.forEach(function(author){
          var id=String(author&&author.id||"").trim().toLowerCase();
          if(id) authorProfiles[id]=author;
        });
      }
    }catch(e){}
  }
  function supportRowMarkup(link){
    var item=link&&typeof link==="object"?link:{};
    var label=String(item.label||"支持作者").trim()||"支持作者";
    var url=String(item.url||"").trim();
    return '<div class="yb-support-row" data-support-row>'+
      '<label>按鈕文字<input name="author_support_label" maxlength="40" value="'+esc(label)+'" placeholder="例如 支持作者"></label>'+
      '<label>外部支持連結<input name="author_support_url" type="url" maxlength="600" inputmode="url" value="'+esc(url)+'" placeholder="https://..."></label>'+
      '<button class="yb-support-remove" type="button" data-remove-support aria-label="移除這個支持方式">移除</button>'+
      '</div>';
  }
  function authorSection(){
    var claimed=authorIdentity&&authorIdentity.author_id;
    var authorId=claimed||"";
    var published=authorId?authorProfiles[authorId]||null:null;
    var name=published&&published.name||profile&&profile.display_name||"";
    var bio=published&&published.bio||"";
    var supportLinks=published&&Array.isArray(published.support_links)?published.support_links.slice(0,5):[];
    if(!supportLinks.length) supportLinks=[{label:"支持作者",url:""}];
    var intro=claimed
      ?"這個作者 ID 已綁定目前帳號。顯示名稱、簡介與支持方式可以改；作者 ID 本身保持穩定。"
      :"作者身份是可選的公開身份，不等於登入帳號。第一次發布作品前建立一次即可。";
    var publicLink=published
      ? '<a class="yb-secondary" href="author.html?id='+encodeURIComponent(authorId)+'">查看公開作者頁</a>'
      : "";
    return '<div class="yb-box" id="author-identity-box"><b>作者身份</b><p class="yb-note">'+esc(intro)+'</p>'+
      '<form class="yb-form" id="author-profile-form">'+
      '<label>作者 ID<input name="author_id" required maxlength="64" pattern="[a-z0-9][a-z0-9_-]{1,63}" placeholder="例如 yoru-writer" value="'+esc(authorId)+'" '+(claimed?"readonly":"")+'><small class="yb-note">公開穩定識別碼；建立後不跟著顯示名稱改動。</small></label>'+
      '<label>作者顯示名稱<input name="author_name" required maxlength="80" value="'+esc(name)+'" placeholder="玩家看到的作者名稱"></label>'+
      '<label>作者公開簡介<textarea name="author_bio" maxlength="1200" rows="3" placeholder="選填">'+esc(bio)+'</textarea></label>'+
      '<div class="yb-support-editor">'+
        '<div class="yb-support-head"><div><b>外部支持方式</b><p class="yb-note">最多 5 個 HTTPS 公開連結。玩家會直接前往作者提供的頁面；夜灣不代收、不轉金流、不抽成。</p></div>'+
        '<button class="yb-secondary" id="author-add-support" type="button">＋ 新增支持方式</button></div>'+
        '<div class="yb-support-list" id="author-support-list">'+supportLinks.map(supportRowMarkup).join("")+'</div>'+
      '</div>'+
      '<div class="yb-actions"><button class="yb-primary" type="submit">'+(claimed?"送出作者資料更新 PR":"建立作者身份並送出公開資料 PR")+'</button>'+publicLink+'</div>'+
      '<div class="yb-error" id="author-error"></div><div class="yb-note" id="author-result">'+
      (claimed&&!published?"作者身份已建立；公開作者頁要等第一支作者資料 PR 合併後才會出現。":"")+
      '</div></form></div>';
  }
  function bindAuthorForm(){
    var form=document.getElementById("author-profile-form");
    if(!form) return;
    var supportList=document.getElementById("author-support-list");
    var addSupport=document.getElementById("author-add-support");
    function supportRows(){
      return supportList?Array.prototype.slice.call(supportList.querySelectorAll("[data-support-row]")):[];
    }
    function updateSupportControls(){
      if(addSupport) addSupport.disabled=supportRows().length>=5;
    }
    if(addSupport){
      addSupport.onclick=function(){
        if(!supportList||supportRows().length>=5) return;
        supportList.insertAdjacentHTML("beforeend",supportRowMarkup({label:"支持作者",url:""}));
        updateSupportControls();
      };
    }
    if(supportList){
      supportList.onclick=function(event){
        var remove=event.target.closest("[data-remove-support]");
        if(!remove) return;
        var row=remove.closest("[data-support-row]");
        var rows=supportRows();
        if(!row) return;
        if(rows.length<=1){
          var labelInput=row.querySelector('[name="author_support_label"]');
          var urlInput=row.querySelector('[name="author_support_url"]');
          if(labelInput) labelInput.value="支持作者";
          if(urlInput) urlInput.value="";
        }else{
          row.remove();
        }
        updateSupportControls();
      };
    }
    updateSupportControls();
    form.onsubmit=async function(event){
      event.preventDefault();
      var button=form.querySelector('button[type="submit"]');
      var error=document.getElementById("author-error");
      var result=document.getElementById("author-result");
      if(error) error.textContent="";
      if(result) result.textContent="";
      button.disabled=true;
      try{
        var links=supportRows().map(function(row){
          var labelInput=row.querySelector('[name="author_support_label"]');
          var urlInput=row.querySelector('[name="author_support_url"]');
          return {
            label:String(labelInput&&labelInput.value||"支持作者").trim()||"支持作者",
            url:String(urlInput&&urlInput.value||"").trim()
          };
        }).filter(function(link){return Boolean(link.url);});
        var payload={
          author_id:String(form.elements.author_id.value||"").trim().toLowerCase(),
          author_name:String(form.elements.author_name.value||"").trim(),
          author_bio:String(form.elements.author_bio.value||"").trim(),
          support_links:links
        };

        if(!authorIdentity){
          var claim=await call("/me/authors/claim",{
            method:"POST",
            credentials:"include",
            body:JSON.stringify({author_id:payload.author_id})
          },legacyToken||undefined);
          authorIdentity={
            author_id:claim.author_id,
            created_at:claim.created_at
          };
        }

        if(authorIdentity.author_id!==payload.author_id) throw new Error("這個作者身份不屬於目前帳號。");

        var data=await call("/me/authors/profile-pr",{
          method:"POST",
          credentials:"include",
          body:JSON.stringify(payload)
        },legacyToken||undefined);

        if(result){
          result.innerHTML='✓ 作者資料 PR #'+esc(data.pr_number||"—")+' 已建立；合併後公開作者頁才會更新。'+
            (data.pr_url?' <a href="'+esc(data.pr_url)+'" target="_blank" rel="noopener noreferrer">開啟 PR</a>':'');
        }
        form.elements.author_id.readOnly=true;
        button.textContent="送出作者資料更新 PR";
      }catch(errorValue){
        if(error) error.textContent=errorValue.message||String(errorValue);
      }finally{
        if(button) button.disabled=false;
      }
    };
  }

  function usagePointsFromUsd(value){
    var n=Number(value);
    if(!Number.isFinite(n)||n<=0) return 0;
    return n*1000;
  }
  function formatUsagePoints(value){
    var n=Number(value||0);
    if(!Number.isFinite(n)) n=0;
    return n.toLocaleString("zh-TW",{minimumFractionDigits:0,maximumFractionDigits:2})+" 點";
  }
  function usageKindLabel(kind){
    var labels={
      chat:"故事",
      memory:"記憶",
      "memory-repair":"記憶修復",
      state:"世界狀態",
      "story-tool":"故事工具",
      auxiliary:"輔助"
    };
    return labels[String(kind||"")]||"模型請求";
  }
  function formatUsageTime(value){
    var date=new Date(value);
    if(Number.isNaN(date.getTime())) return "時間未知";
    return date.toLocaleString("zh-TW",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
  }
  function localUsageSignature(entry){
    return [
      String(entry&&entry.at||""),
      String(entry&&entry.model||""),
      String(entry&&entry.kind||""),
      String(entry&&entry.input!=null?entry.input:""),
      String(entry&&entry.output!=null?entry.output:""),
      String(entry&&entry.cached!=null?entry.cached:""),
      String(entry&&entry.actualUsd!=null?entry.actualUsd:"")
    ].join("|");
  }
  function usageFromPayload(payload){
    var ledger=payload&&payload.chat&&Array.isArray(payload.chat.usageLedger)?payload.chat.usageLedger:[];
    return ledger.filter(function(entry){
      return entry&&typeof entry==="object"&&Number.isFinite(Number(entry.actualUsd))&&Number(entry.actualUsd)>0;
    });
  }
  function readLegacyStoryPayloads(){
    var payloads=[];
    try{
      var autosave=JSON.parse(localStorage.getItem("bao-lab:story:autosave")||"null");
      if(autosave) payloads.push(autosave);
    }catch(e){}
    try{
      var slots=JSON.parse(localStorage.getItem("bao-lab:story:slots")||"[]");
      if(Array.isArray(slots)) payloads=payloads.concat(slots);
    }catch(e){}
    return payloads;
  }
  function readIndexedStoryPayloads(){
    if(typeof indexedDB==="undefined") return Promise.resolve([]);
    return new Promise(function(resolve){
      var request;
      try{request=indexedDB.open("bao-lab");}
      catch(e){resolve([]);return;}
      request.onerror=function(){resolve([]);};
      request.onupgradeneeded=function(){
        try{request.transaction.abort();}catch(e){}
        resolve([]);
      };
      request.onsuccess=function(){
        var db=request.result;
        if(!db.objectStoreNames.contains("stories")){db.close();resolve([]);return;}
        var tx=db.transaction("stories","readonly");
        var getAll=tx.objectStore("stories").getAll();
        getAll.onerror=function(){db.close();resolve([]);};
        getAll.onsuccess=function(){
          var records=Array.isArray(getAll.result)?getAll.result:[];
          db.close();
          resolve(records.map(function(record){return record&&record.payload;}).filter(Boolean));
        };
      };
    });
  }
  async function readLocalUsageEntries(){
    var payloads=readLegacyStoryPayloads();
    try{payloads=payloads.concat(await readIndexedStoryPayloads());}catch(e){}
    var seen=new Set();
    var entries=[];
    payloads.forEach(function(payload){
      usageFromPayload(payload).forEach(function(entry){
        var key=localUsageSignature(entry);
        if(seen.has(key)) return;
        seen.add(key);
        entries.push(entry);
      });
    });
    entries.sort(function(a,b){return String(b.at||"").localeCompare(String(a.at||""));});
    return entries;
  }
  async function renderLocalUsage(){
    var total=document.getElementById("local-usage-total");
    var meta=document.getElementById("local-usage-meta");
    var list=document.getElementById("local-usage-list");
    if(!total||!meta||!list) return;
    total.textContent="讀取本機紀錄…";
    meta.textContent="";
    list.innerHTML="";
    try{
      var entries=await readLocalUsageEntries();
      var allPoints=entries.reduce(function(sum,entry){return sum+usagePointsFromUsd(entry.actualUsd);},0);
      var now=new Date();
      var monthPoints=entries.reduce(function(sum,entry){
        var date=new Date(entry.at);
        return !Number.isNaN(date.getTime())&&date.getFullYear()===now.getFullYear()&&date.getMonth()===now.getMonth()
          ? sum+usagePointsFromUsd(entry.actualUsd)
          : sum;
      },0);
      total.textContent="本機已記錄消耗 "+formatUsagePoints(allPoints);
      meta.textContent=entries.length
        ? "本月 "+formatUsagePoints(monthPoints)+" · "+entries.length.toLocaleString("zh-TW")+" 筆已知扣款。這裡只讀取這台裝置的故事存檔，不會額外查詢夜灣伺服器。"
        : "這台裝置目前沒有可辨識的燈火扣款紀錄。舊版本、其他裝置或已清除的本機資料不會出現在這裡。";
      if(!entries.length){
        list.innerHTML='<div class="yb-usage-empty">官方目前剩餘燈火，以上方「同步最新燈火」顯示為準。</div>';
        return;
      }
      list.innerHTML=entries.slice(0,12).map(function(entry){
        var model=String(entry.model||"未知模型");
        var input=Number.isFinite(Number(entry.input))?Number(entry.input).toLocaleString("zh-TW"):"—";
        var output=Number.isFinite(Number(entry.output))?Number(entry.output).toLocaleString("zh-TW"):"—";
        var cached=Number.isFinite(Number(entry.cached))&&Number(entry.cached)>0?" · Cache "+Number(entry.cached).toLocaleString("zh-TW"):"";
        return '<div class="yb-usage-item">'+
          '<div class="yb-usage-item-main"><span class="yb-usage-item-model">'+esc(model)+' · '+esc(usageKindLabel(entry.kind))+'</span>'+
          '<span class="yb-usage-item-points">−'+esc(formatUsagePoints(usagePointsFromUsd(entry.actualUsd)))+'</span></div>'+
          '<div class="yb-usage-item-sub">'+esc(formatUsageTime(entry.at))+' · Input '+esc(input)+' · Output '+esc(output)+esc(cached)+'</div>'+
          '</div>';
      }).join("");
      if(entries.length>12) list.insertAdjacentHTML("beforeend",'<div class="yb-usage-meta">先顯示最近 12 筆；完整本機紀錄仍保留在故事存檔中。</div>');
    }catch(error){
      total.textContent="本機消費紀錄暫時無法讀取";
      meta.textContent="這不影響帳號餘額或故事。可以重新整理頁面後再試。";
    }
  }

  function show(name){
    if(name==="account"&&!profile) name="login";
    document.querySelectorAll("[data-panel]").forEach(function(p){p.hidden=p.dataset.panel!==name;});
    document.querySelectorAll("[data-tab]").forEach(function(b){b.classList.toggle("active",b.dataset.tab===name);});
    render();
  }
  function render(){
    var tab=document.querySelector('[data-tab="account"]');
    if(tab) tab.hidden=!profile;
    var body=document.getElementById("account-body");
    if(!body||!profile) return;
    body.innerHTML='<div class="yb-box">'+
      '<div class="yb-row"><span>顯示名稱</span><b id="v-display"></b></div>'+
      '<div class="yb-row"><span>帳號</span><b id="v-user"></b></div>'+
      '<div class="yb-row"><span>玩家編號</span><b id="v-id"></b></div></div>'+
      '<div class="yb-note">我的燈火</div><div class="yb-wallet" id="v-wallet"></div>'+
      '<div class="yb-note" id="v-billing"></div>'+
      '<div class="yb-actions"><button class="yb-secondary" id="copy-id">複製玩家編號</button><button class="yb-secondary" id="refresh">同步最新燈火</button></div>'+
      '<div class="yb-box" id="local-usage"><div class="yb-usage-head"><div><b>我的消費</b><p class="yb-note">查看這台裝置已保存的夜灣燈火消耗，不會因為打開這裡就一直查詢後端。</p></div><button class="yb-secondary" id="reload-local-usage" type="button">重新讀取本機紀錄</button></div><div class="yb-usage-total" id="local-usage-total">讀取本機紀錄…</div><div class="yb-usage-meta" id="local-usage-meta"></div><div class="yb-usage-list" id="local-usage-list"></div></div>'+
      authorSection()+
      '<div class="yb-box"><b>替故事添一盞燈</b><p class="yb-note">完成付款後提供玩家編號，管理員確認後會把燈火加入帳號。燈火只在使用夜灣提供的模型服務時消耗；使用自己的模型連線不會消耗。失敗請求若第三方未產生成本會返還；若已產生實際模型用量，則按實際用量結算。</p>'+
      '<div class="yb-packages"><div class="yb-package">NT$250 / US$8 → 5,000 燈火</div><div class="yb-package">NT$500 / US$16 → 10,000 燈火</div><div class="yb-package">NT$1,000 / US$32 → 20,000 燈火</div><div class="yb-package">NT$2,500 / US$80 → 50,000 燈火</div></div><p class="yb-note"><a href="lights-refund-policy.html">購買前查看燈火與退款政策 →</a></p></div>'+
      '<div class="yb-actions"><a class="yb-primary" href="index.html">回到夜灣</a><button class="yb-secondary" id="logout">登出</button></div>';
    document.getElementById("v-display").textContent=profile.display_name||"—";
    document.getElementById("v-user").textContent=profile.username||"—";
    document.getElementById("v-id").textContent=profile.public_id||"—";
    document.getElementById("v-wallet").textContent=points(profile.wallet_balance_usd);
    document.getElementById("v-billing").textContent=profile.billing_mode==="cost_usd_v2"?"依實際模型使用量消耗燈火":"目前帳號仍在舊測試額度模式";
    document.getElementById("copy-id").onclick=async function(){
      try{await navigator.clipboard.writeText(profile.public_id||"");}
      catch(e){window.prompt("複製玩家編號：",profile.public_id||"");}
    };
    document.getElementById("refresh").onclick=function(){refresh(false);};
    document.getElementById("reload-local-usage").onclick=renderLocalUsage;
    document.getElementById("logout").onclick=logout;
    renderLocalUsage();
    bindAuthorForm();
  }
  function recovery(code){
    show("account");
    var body=document.getElementById("account-body");
    body.innerHTML='<h3>帳號建立／恢復成功</h3><p class="yb-note">請立即保存新的恢復碼。這組明文只在現在顯示；夜灣帳號後端只保存雜湊，管理員之後也無法替你查回。</p>'+
      '<div class="yb-recovery" id="recovery-code"></div><div class="yb-actions"><button class="yb-primary" id="copy-recovery">複製恢復碼</button><button class="yb-secondary" id="finish">我已保存</button></div>';
    document.getElementById("recovery-code").textContent=code||"";
    document.getElementById("copy-recovery").onclick=async function(){
      try{await navigator.clipboard.writeText(code||"");}catch(e){window.prompt("複製恢復碼：",code||"");}
    };
    document.getElementById("finish").onclick=render;
  }
  async function refresh(silent){
    try{
      if(legacyToken){
        try{
          profile=await call("/me",{method:"GET",credentials:"include"},legacyToken);
          markSignedIn();
        }catch(error){
          if(error&&error.code!=="transport") throw error;
          profile=await call("/me",{method:"GET",credentials:"omit"},legacyToken);
          markLegacySignedIn();
        }
      }else{
        profile=await call("/me",{method:"GET",credentials:"include"});
        markSignedIn();
      }
      await loadAuthorContext();
      show("account");
    }
    catch(error){
      markSignedOut();
      profile=null;
      if(!silent) alert(error.message);
      show("login");
    }
  }
  async function logout(){
    var old=legacyToken;
    profile=null;
    authorIdentity=null;
    authorProfiles={};
    try{await call("/auth/logout",{method:"POST",credentials:old?"omit":"include"},old);}catch(e){}
    markSignedOut();
    show("login");
  }
  document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){show(b.dataset.tab);};});
  document.getElementById("login-form").onsubmit=async function(event){
    event.preventDefault();msg("login-error","");
    var f=event.currentTarget,button=f.querySelector("button");button.disabled=true;
    try{
      var data=await call("/auth/login",{method:"POST",credentials:"omit",body:JSON.stringify({username:f.elements.username.value.trim(),password:f.elements.password.value})});
      if(!rememberLegacySession(data)) throw new Error("登入回應缺少可用的 Session，請稍後再試。");
      await refresh(true);
    }catch(error){msg("login-error",error.message);}finally{button.disabled=false;}
  };
  document.getElementById("register-form").onsubmit=async function(event){
    event.preventDefault();msg("register-error","");
    var f=event.currentTarget;if(f.elements.password.value!==f.elements.password_confirm.value){msg("register-error","兩次輸入的密碼不一致。");return;}
    var button=f.querySelector("button");button.disabled=true;
    try{
      var data=await call("/auth/register",{method:"POST",credentials:"omit",body:JSON.stringify({username:f.elements.username.value.trim(),display_name:f.elements.display_name.value.trim(),password:f.elements.password.value})});
      if(!rememberLegacySession(data)) throw new Error("註冊回應缺少可用的 Session，請稍後再試。");
      await refresh(true);
      f.reset();recovery(data.recovery_code);
    }catch(error){msg("register-error",error.message);}finally{button.disabled=false;}
  };
  document.getElementById("recover-form").onsubmit=async function(event){
    event.preventDefault();msg("recover-error","");
    var f=event.currentTarget,button=f.querySelector("button");button.disabled=true;
    try{
      var data=await call("/auth/recover",{method:"POST",credentials:"omit",body:JSON.stringify({public_id:f.elements.public_id.value.trim(),recovery_code:f.elements.recovery_code.value.trim(),new_password:f.elements.new_password.value})});
      if(!rememberLegacySession(data)) throw new Error("恢復回應缺少可用的 Session，請稍後再試。");
      await refresh(true);
      f.reset();recovery(data.recovery_code);
    }catch(error){msg("recover-error",error.message);}finally{button.disabled=false;}
  };
  refresh(true);
})();
</script>
